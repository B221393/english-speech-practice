<script id="practiceData" type="application/json">{"slides": [{"page": 1, "title": "Image-based evaluation of machine-tool thermal displacement", "en": ["My name is Yuto Shimomura.", "Today I will present my progress on image-based evaluation of machine-tool thermal displacement."], "ja": ["下村です。", "本日は、画像計測による工作機械の熱変位評価について、現在までの進捗を報告します。"], "hidden": false, "delivery": "名乗った後に1秒置く。題目のthermal displacementをゆっくり述べ、文末を下げる。", "ja_sentences": ["下村です。", "本日は、画像計測による工作機械の熱変位評価について、現在までの進捗を報告します。"]}, {"page": 2, "title": "Background", "en": ["Thermal deformation means deformation caused by a change in temperature.", "In a machine tool, this deformation can change the relative position of the spindle and the worktable.", "A change in their relative position can affect machining accuracy.", "The quantity I want to identify is the relative deviation in X, Y, and Z.", "The camera measures changes in image coordinates.", "To relate image coordinates to machine coordinates, I need to check the camera mounting and the axis directions."], "ja": ["熱変形とは、温度変化によって生じる変形です。", "工作機械では、この変形によって主軸とテーブルの相対位置が変わることがあります。", "両者の相対位置の変化は、加工精度に影響することがあります。", "求めたい量は、X・Y・Z方向の相対的な位置のずれです。", "カメラが測るのは、画像座標上の変化です。", "画像座標を機械座標に対応づけるため、カメラの取付と各軸の向きを確認する必要があります。"], "hidden": false, "delivery": "定義の後に1秒置く。主軸からテーブルへ指示を移してからrelative positionを強調する。", "ja_sentences": ["熱変形とは、温度変化によって生じる変形です。", "工作機械では、この変形によって主軸とテーブルの相対位置が変わることがあります。", "両者の相対位置の変化は、加工精度に影響することがあります。", "求めたい量は、X・Y・Z方向の相対的な位置のずれです。", "カメラが測るのは、画像座標上の変化です。", "画像座標を機械座標に対応づけるため、カメラの取付と各軸の向きを確認する必要があります。"]}, {"page": 3, "title": "Displacement measurement methods", "en": ["Conventional approaches include touch probes and displacement sensors.", "For a touch probe, the machine position is recorded when contact occurs.", "Optical devices provide noncontact observation.", "A camera can record a target pattern, and displacement can be calculated from changes in the images.", "A major advantage is that the camera itself is low cost.", "In a previous study, three-dimensional thermal drift was measured using a spindle-mounted microscope, and the results were validated against capacitive displacement sensors.", "However, heating of the microscope affected the Z measurements during spindle cooldown.", "The reported Z errors in that test ranged from ten to thirty-five micrometers.", "The authors identified improved thermal stability and uncertainty analysis as future work.", "These are remaining challenges of the prior method."], "ja": ["従来法には、タッチプローブや変位センサがあります。", "タッチプローブでは、接触したときの機械位置を記録します。", "光学式の装置では、非接触で観察できます。", "カメラでターゲットの模様を撮影し、画像の変化から変位を計算できます。", "大きな利点は、カメラ自体が安価であることです。", "先行研究では、主軸に取り付けた顕微鏡で3次元の熱変位を測定し、静電容量式変位センサとの比較で検証しました。", "ただし、主軸冷却試験では顕微鏡が温められ、Z方向の測定に影響しました。", "その試験で報告されたZ方向の誤差は、10〜35 µmでした。", "著者らは、熱安定性の改善と不確かさ解析を今後の課題に挙げています。", "これらが、先行手法に残る課題です。"], "hidden": false, "delivery": "先行研究の成果を先に述べ、Howeverの前に1秒置く。10〜35 µmは主軸冷却試験の結果として述べる。先行研究が精度未検証だとは言わない。", "ja_sentences": ["従来法には、タッチプローブや変位センサがあります。", "タッチプローブでは、接触したときの機械位置を記録します。", "光学式の装置では、非接触で観察できます。", "カメラでターゲットの模様を撮影し、画像の変化から変位を計算できます。", "大きな利点は、カメラ自体が安価であることです。", "先行研究では、主軸に取り付けた顕微鏡で3次元の熱変位を測定し、静電容量式変位センサとの比較で検証しました。", "ただし、主軸冷却試験では顕微鏡が温められ、Z方向の測定に影響しました。", "その試験で報告されたZ方向の誤差は、10〜35 µmでした。", "著者らは、熱安定性の改善と不確かさ解析を今後の課題に挙げています。", "これらが、先行手法に残る課題です。"]}, {"page": 4, "title": "Purpose of this study", "en": ["The purpose of this study is to evaluate image-based measurement of relative displacement between the spindle and the worktable.", "To date, we have completed the measurement system design and assembly, developed the measurement software and displacement algorithms, and prepared the machine tool for experiments.", "The next stages are uncertainty evaluation and actual thermal deformation measurement."], "ja": ["本研究の目的は、主軸とテーブルの相対変位を画像から測定する方法を評価することです。", "現在までに、測定システムの設計と組み立て、測定ソフトウェアの開発、変位計算アルゴリズムの設計、および工作機械の準備を完了しています。", "次の段階は、誤差の推定（不確かさ評価）と実際の熱変形の測定です。"], "hidden": false, "delivery": "目的を一文で述べて1秒置く。完了した4項目を明確に述べ、未着手の2項目を今後の課題として対比して説明する。", "ja_sentences": ["本研究の目的は、主軸とテーブルの相対変位を画像から測定する方法を評価することです。", "現在までに、測定システムの設計と組み立て、測定ソフトウェアの開発、変位計算アルゴリズムの設計、および工作機械の準備を完了しています。", "次の段階は、誤差の推定（不確かさ評価）と実際の熱変形の測定です。"]}, {"page": 5, "title": "Measurement system", "en": ["This slide shows the measurement system.", "I will first explain the imaging assembly on the left.", "The assembly consists of a lens, a camera, and a six-degree-of-freedom adjustment unit.", "It is mounted on the spindle and observes the targets on the worktable.", "On the right, Target A is used for calibration.", "Its known dot spacing gives the pixel scale, and its rotating dot trajectories give the rotation center.", "Target B is used for displacement measurement in XY and Z."], "ja": ["このスライドは、測定装置を示しています。", "まず、左側の撮影ユニットを説明します。", "このユニットは、レンズ、カメラ、6自由度の調整機構で構成されています。", "主軸に取り付けて、テーブル上のターゲットを観察します。", "右側のTarget Aは、校正に使います。", "既知のドット間隔から画素倍率を求め、回転するドットの軌跡から回転中心を求めます。", "Target Bは、XY方向とZ方向の変位測定に使います。"], "hidden": false, "delivery": "AとBの間に1秒置く。名称を述べてから写真を指す。図が表示される前に部品の説明を始めない。", "ja_sentences": ["このスライドは、測定装置を示しています。", "まず、左側の撮影ユニットを説明します。", "このユニットは、レンズ、カメラ、6自由度の調整機構で構成されています。", "主軸に取り付けて、テーブル上のターゲットを観察します。", "右側のTarget Aは、校正に使います。", "既知のドット間隔から画素倍率を求め、回転するドットの軌跡から回転中心を求めます。", "Target Bは、XY方向とZ方向の変位測定に使います。"]}, {"page": 6, "title": "Step 1: pixel scale calibration", "en": ["Step one is pixel-scale calibration.", "The known distance between neighboring dot centers is two hundred micrometers.", "I compare this known distance with the spacing measured in pixels.", "The overlay shows the selected dots and the links between neighboring dots.", "Dots at the outer edge are excluded.", "For this image, thirty-one dots and forty-eight links are used.", "The lattice model accounts for rotation of the pattern.", "The identified spacing is about two hundred thirty-three point four nine pixels.", "Dividing two hundred micrometers by this spacing gives about zero point eight five six five six micrometers per pixel."], "ja": ["ステップ1は、画素倍率の校正です。", "隣接するドット中心間の既知の距離は、200 µmです。", "この距離を、画素単位で測った間隔と比較します。", "重ね図は、採用したドットと、隣接するドットを結ぶ線を示しています。", "外周のドットは除外します。", "この画像では、31個のドットと48本の接続線を使っています。", "格子モデルでは、模様の回転も考慮しています。", "求められた格子間隔は、約233.49画素です。", "200 µmをこの間隔で割ると、1画素当たり約0.85656 µmになります。"], "hidden": false, "delivery": "式の分子、分母、結果の順に指す。0.85656は桁ごとにゆっくり読み、単位の前に短く間を置く。（例示画像は校正10件目のまま．12ページの平均から外したこととは別に扱う）", "ja_sentences": ["ステップ1は、画素倍率の校正です。", "隣接するドット中心間の既知の距離は、200 µmです。", "この距離を、画素単位で測った間隔と比較します。", "重ね図は、採用したドットと、隣接するドットを結ぶ線を示しています。", "外周のドットは除外します。", "この画像では、31個のドットと48本の接続線を使っています。", "格子モデルでは、模様の回転も考慮しています。", "求められた格子間隔は、約233.49画素です。", "200 µmをこの間隔で割ると、1画素当たり約0.85656 µmになります。"]}, {"page": 7, "title": "Step 2: rotation center", "en": ["Step two estimates the rotation center.", "When the pattern rotates, the dots follow circular arcs.", "These arcs are used to estimate a common center.", "The display is based on four hundred eighty-six recorded frames.", "I used fourteen dots that could be tracked throughout the sequence.", "The rings show the current dots, and the lines show their observed paths.", "Please follow one dot for a moment.", "The shared center is estimated from these paths."], "ja": ["ステップ2では、回転中心を推定します。", "模様が回転すると、ドットは円弧に沿って動きます。", "これらの円弧から、共通の中心を推定します。", "この表示は、記録済みの486フレームに基づいています。", "全フレームを通して追跡できた14個のドットを使いました。", "円は現在のドット位置を、線は観測された軌跡を示しています。", "1個のドットに注目してください。", "これらの軌跡から、共通の中心を推定します。"], "hidden": false, "delivery": "円弧に沿う1点を指してから共通の回転中心へ移る。", "ja_sentences": ["ステップ2では、回転中心を推定します。", "模様が回転すると、ドットは円弧に沿って動きます。", "これらの円弧から、共通の中心を推定します。", "この表示は、記録済みの486フレームに基づいています。", "全フレームを通して追跡できた14個のドットを使いました。", "円は現在のドット位置を、線は観測された軌跡を示しています。", "1個のドットに注目してください。", "これらの軌跡から、共通の中心を推定します。"]}, {"page": 8, "title": "Step 3: in-plane displacement", "en": ["I determine the deviations in pixel between two images using an FFT-method.", "First, I calculate the two-dimensional Fourier transform of each image.", "Next, I normalize the phase difference.", "The peak after the inverse transform gives the horizontal and vertical pix <script>

'use strict';
const DATA=JSON.parse(document.getElementById('practiceData').textContent);
const $=id=>document.getElementById(id), synth=window.speechSynthesis;
let pageIndex=0, voices=[], utterance=null, speakToken=0, spoken=false, activeSentence=-1, playbackMode='idle';
const status=message=>$('status').textContent=message;
const current=()=>DATA.slides[pageIndex];
const segmenter=typeof Intl.Segmenter==='function'?new Intl.Segmenter('en',{granularity:'sentence'}):null;
const sentenceList=slide=>slide.en.flatMap(p=>segmenter?[...segmenter.segment(p)].map(s=>s.segment):p.split(/(?<=[.!?])\s+(?=[A-Z])/)).map(s=>s.trim()).filter(Boolean);
const sentences=()=>sentenceList(current());
const presentationSlides=()=>DATA.slides.map((slide,index)=>({slide,index})).filter(item=>!item.slide.hidden);
function setTab(name){for(const id of ['practice','vocab']){$(id).hidden=id!==name;$(id+'Tab').setAttribute('aria-selected',String(id===name));}if(name==='vocab')renderWords();}
$('practiceTab').onclick=()=>setTab('practice');$('vocabTab').onclick=()=>setTab('vocab');
function loadVoices(){if(!synth)return;voices=synth.getVoices().filter(v=>/^en(?:-|_)/i.test(v.lang));const old=$('voice').value;$('voice').replaceChildren();if(!voices.length){const o=new Option('English (browser default)','');$('voice').add(o);}else voices.forEach((v,i)=>$('voice').add(new Option(v.name+' / '+v.lang,String(i))));if([...$('voice').options].some(o=>o.value===old))$('voice').value=old;}
if(synth){loadVoices();synth.addEventListener('voiceschanged',loadVoices);}else{for(const id of ['runAll','read','pause','stopSpeech'])$(id).disabled=true;status('このブラウザは読み上げに対応していません。原稿は表示できます。');}
function highlight(){document.querySelectorAll('.sentence').forEach((el,i)=>el.classList.toggle('active',i===activeSentence));if(activeSentence>=0){const active=document.querySelector('.sentence.active');active?.scrollIntoView({block:'nearest',behavior:'auto'});}}
function stopSpeech(){speakToken++;spoken=false;activeSentence=-1;utterance=null;playbackMode='idle';if(synth)synth.cancel();$('pause').textContent='一時停止';$('runProgressWrap').hidden=true;highlight();refreshControls();}
function speak(text,index=-1,done=()=>{}){if(!synth)return status('読み上げは非対応です。');const token=speakToken;utterance=new SpeechSynthesisUtterance(text);utterance.lang='en-US';utterance.rate=Number($('rate').value);if(voices[Number($('voice').value)])utterance.voice=voices[Number($('voice').value)];activeSentence=index;spoken=true;highlight();utterance.onend=()=>{if(token!==speakToken)return;done();};utterance.onerror=e=>{if(token!==speakToken||e.error==='canceled'||e.error==='interrupted')return;speakToken++;const wasRun=playbackMode==='presentation';spoken=false;activeSentence=-1;playbackMode='idle';utterance=null;highlight();refreshControls();if(wasRun)$('runLabel').textContent='音声エラーで通し再生を停止しました';status('読み上げエラー: '+e.error);};synth.speak(utterance);}
function playSentence(i){stopSpeech();const token=speakToken;const run=()=>{if(token!==speakToken)return;speak(sentences()[i],i,()=>{if($('loop').checked){setTimeout(run,600);}else{spoken=false;activeSentence=-1;highlight();}});};run();}
function playAll(){stopSpeech();const list=sentences(),token=speakToken;let i=0;const run=()=>{if(token!==speakToken)return;if(i>=list.length){spoken=false;activeSentence=-1;highlight();return;}const index=i++;speak(list[index],index,run);};run();}

function playPresentation(){
  if(!synth)return status('このブラウザは読み上げ非対応です。');
  stopSpeech();setTab('practice');playbackMode='presentation';
  const pages=presentationSlides();
  const queue=pages.flatMap((item,pageOrder)=>sentenceList(item.slide).map((text,sentenceIndex)=>({text,sentenceIndex,pageIndex:item.index,pageOrder})));
  const token=speakToken;let position=0;
  $('runProgressWrap').hidden=false;$('runProgress').max=queue.length;$('runProgress').value=0;
  const run=()=>{
    if(token!==speakToken)return;
    if(position>=queue.length){
      spoken=false;activeSentence=-1;playbackMode='idle';highlight();refreshControls();
      $('runProgress').value=queue.length;$('runLabel').textContent=`本編${pages.length}ページ / ${queue.length}文 再生終了`;
      status(`本編${pages.length}ページの通し再生が終わりました。`);return;
    }
    const item=queue[position++];
    if(pageIndex!==item.pageIndex){pageIndex=item.pageIndex;renderPage({keepSpeech:true});}
    $('runProgress').value=position;$('runLabel').textContent=`本編 ${item.pageOrder+1}/${pages.length}ページ / ${position}/${queue.length}文`;
    status(`通し再生中: ${item.pageOrder+1}/${pages.length}ページ。一時停止・再開・停止ができます。`);
    speak(item.text,item.sentenceIndex,run);
  };
  run();
}
$('runAll').onclick=playPresentation;

$('read').onclick=playAll;$('stopSpeech').onclick=stopSpeech;$('pause').onclick=()=>{if(!synth||!spoken)return;if(synth.paused){synth.resume();$('pause').textContent='一時停止';}else{synth.pause();$('pause').textContent='再開';}};
function renderPage({keepSpeech=false}={}){
  if(!keepSpeech)stopSpeech();
  const s=current();$('title').textContent=`${s.page}. ${s.title}`;$('page').value=String(pageIndex);
  $('sentences').replaceChildren();
  sentences().forEach((text,i)=>{
    const row=document.createElement('div');row.className='sentence';
    const b=document.createElement('button');b.textContent='再生';b.setAttribute('aria-label',`${i+1}文目を再生`);b.disabled=!synth;b.onclick=()=>playSentence(i);
    const copy=document.createElement('div');copy.className='sentence-copy';
    const en=document.createElement('p');en.className='english';en.lang='en';en.textContent=text;
    const ja=document.createElement('p');ja.className='translation';ja.lang='ja';ja.textContent=s.ja_sentences[i];
    copy.append(en,ja);row.append(b,copy);$('sentences').append(row);
  });
  $('japanese').replaceChildren();s.ja.forEach(text=>{const p=document.createElement('p');p.textContent=text;$('japanese').append(p);});
  $('cue').textContent=s.delivery;renderWords();refreshControls();
}

DATA.slides.forEach((s,i)=>$('page').add(new Option(`${s.page}. ${s.title}${s.hidden?' [参考・非表示]':''}`,String(i))));
$('page').onchange=()=>{pageIndex=Number($('page').value);renderPage();};
$('prev').onclick=()=>{if(pageIndex>0){pageIndex--;renderPage();}};
$('next').onclick=()=>{if(pageIndex<DATA.slides.length-1){pageIndex++;renderPage();}};

function renderWords(){const query=$('filter').value.trim().toLowerCase();$('words').replaceChildren();let count=0;for(const w of DATA.words){if($('currentOnly').checked&&!w.pages.includes(current().page))continue;if(query&&!`${w.term} ${w.ja}`.toLowerCase().includes(query))continue;count++;const box=document.createElement('article');box.className='word';const b=document.createElement('button');b.textContent=w.term;b.disabled=!synth;b.onclick=()=>{stopSpeech();speak(w.say||w.term,-1,()=>{spoken=false;});};box.append(b);for(const text of [w.ja,w.stress,`原稿に${w.count}回 / ページ ${w.pages.join(', ')}`]){const p=document.createElement('p');p.textContent=text;box.append(p);}$('words').append(box);}if(!count)$('words').textContent='該当する単語はありません。';}
$('filter').oninput=renderWords;$('currentOnly').onchange=renderWords;

function refreshControls(){
  $('prev').disabled=pageIndex===0;$('next').disabled=pageIndex===DATA.slides.length-1;
  for(const id of ['runAll','read','pause','stopSpeech'])$(id).disabled=!synth;
}
const requestedPage=Number(new URL(location.href).searchParams.get('page'));
const requestedIndex=DATA.slides.findIndex(s=>s.page===requestedPage);
if(requestedIndex>=0)pageIndex=requestedIndex;
window.addEventListener('pagehide',stopSpeech);
renderPage();refreshControls();
</script></html>

<style>
:root{--font-sans:"Segoe UI","Yu Gothic UI",sans-serif;color:#18263b;background:#edf1f6;font-size:14px}

button,select{font:inherit;font-size:12px;min-height:26px;height:26px;padding:1px 8px;border:1px solid #b8c6d7;border-radius:4px;background:#fff;color:#173552;cursor:pointer;white-space:nowrap}

button.primary,nav button[aria-selected=true]{background:#245a88;color:#fff;border-color:#245a88}
.qa-link{display:inline-flex;align-items:center;min-height:26px;height:26px;padding:1px 8px;font-size:12px;border:1px solid #b8c6d7;border-radius:4px;text-decoration:none;color:#173552;background:#fff}
.qa-link:hover{background:#edf3fa}
.status{font-size:11px;padding:2px 12px;background:#e4edf5;color:#334155;height:22px;line-height:18px;flex-shrink:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.presentation-progress{display:flex;align-items:center;gap:8px;padding:2px 10px;font-size:11px;color:#324f6d;height:22px;flex-shrink:0;background:#f1f5f9;border-bottom:1px solid #e2e8f0}
.presentation-progress[hidden]{display:none!important}

.work{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
section[hidden]{display:none!important}
.practice{display:block;height:100%;padding:6px;overflow:hidden}

.sentence{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:4px 0;border-bottom:1px solid #f1f5f9}
.sentence button{width:26px;height:24px;min-height:24px;padding:0;font-size:11px;border-radius:3px;align-self:start;margin-top:1px}
.sentence-copy{min-width:0}

.sentence.active p.english{font-weight:650;color:#0284c7}
.sentence.active .translation{color:#1e293b}

.word{background:#fff;border:1px solid #d6dfeb;padding:8px 10px;border-radius:6px}

#page{max-width:320px}
#voice{max-width:180px}
#rate{max-width:65px}

  .bar button,.bar select{min-height:24px;height:24px;padding:1px 4px;font-size:11px}
  #page{max-width:160px;font-size:11px}

  .panel .controls{margin-bottom:4px;gap:4px}

  .sentence{gap:6px;padding:3px 0}
  .sentence button{width:24px;height:22px;min-height:22px;font-size:10px}
  .sentence p.english{font-size:13.5px;line-height:1.35}
  .sentence .translation{font-size:11.5px;line-height:1.3}
  footer{font-size:9.5px;height:16px}
}
</style>

<script id="practiceData" type="application/json">{"slides": [{"page": 1, "title": "Image-based evaluation of machine-tool thermal displacement", "en": ["My name is Yuto Shimomura.", "Today I will present my progress on image-based evaluation of machine-tool thermal displacement."], "ja": ["下村です。", "本日は、画像計測による工作機械の熱変位評価について、現在までの進捗を報告します。"], "hidden": false, "delivery": "名乗った後に1秒置く。題目のthermal displacementをゆっくり述べ、文末を下げる。", "ja_sentences": ["下村です。", "本日は、画像計測による工作機械の熱変位評価について、現在までの進捗を報告します。"]}, {"page": 2, "title": "Background", "en": ["Thermal deformation means deformation caused by a change in temperature.", "In a machine tool, this deformation can change the relative position of the spindle and the worktable.", "A change in their relative position can affect machining accuracy.", "The quantity I want to identify is the relative deviation in X, Y, and Z.", "The camera measures changes in image coordinates.", "To relate image coordinates to machine coordinates, I need to check the camera mounting and the axis directions."], "ja": ["熱変形とは、温度変化によって生じる変形です。", "工作機械では、この変形によって主軸とテーブルの相対位置が変わることがあります。", "両者の相対位置の変化は、加工精度に影響することがあります。", "求めたい量は、X・Y・Z方向の相対的な位置のずれです。", "カメラが測るのは、画像座標上の変化です。", "画像座標を機械座標に対応づけるため、カメラの取付と各軸の向きを確認する必要があります。"], "hidden": false, "delivery": "定義の後に1秒置く。主軸からテーブルへ指示を移してからrelative positionを強調する。", "ja_sentences": ["熱変形とは、温度変化によって生じる変形です。", "工作機械では、この変形によって主軸とテーブルの相対位置が変わることがあります。", "両者の相対位置の変化は、加工精度に影響することがあります。", "求めたい量は、X・Y・Z方向の相対的な位置のずれです。", "カメラが測るのは、画像座標上の変化です。", "画像座標を機械座標に対応づけるため、カメラの取付と各軸の向きを確認する必要があります。"]}, {"page": 3, "title": "Displacement measurement methods", "en": ["Conventional approaches include touch probes and displacement sensors.", "For a touch probe, the machine position is recorded when contact occurs.", "Optical devices provide noncontact observation.", "A camera can record a target pattern, and displacement can be calculated from changes in the images.", "A major advantage is that the camera itself is low cost.", "In a previous study, three-dimensional thermal drift was measured using a spindle-mounted microscope, and the results were validated against capacitive displacement sensors.", "However, heating of the microscope affected the Z measurements during spindle cooldown.", "The reported Z errors in that test ranged from ten to thirty-five micrometers.", "The authors identified improved thermal stability and uncertainty analysis as future work.", "These are remaining challenges of the prior method.", "That study evaluated thermal drift against independent sensors.", "My current results are preliminary saved-image calculations and comparisons with commanded motion.", "Fixed-condition repeats, independent-reference validation, and uncertainty evaluation are future work."], "ja": ["従来法には、タッチプローブや変位センサがあります。", "タッチプローブでは、接触したときの機械位置を記録します。", "光学式の装置では、非接触で観察できます。", "カメラでターゲットの模様を撮影し、画像の変化から変位を計算できます。", "大きな利点は、カメラ自体が安価であることです。", "先行研究では、主軸に取り付けた顕微鏡で3次元の熱変位を測定し、静電容量式変位センサとの比較で検証しました。", "ただし、主軸冷却試験では顕微鏡が温められ、Z方向の測定に影響しました。", "その試験で報告されたZ方向の誤差は、10〜35 µmでした。", "著者らは、熱安定性の改善と不確かさ解析を今後の課題に挙げています。", "これらが、先行手法に残る課題です。", "先行研究は熱ドリフトを独立したセンサと比較しています。", "今回の結果は、保存画像による予備的な計算と、指令値との差の評価です。", "条件固定の繰返し測定、独立した基準との比較、不確かさ評価は今後の課題です。"], "hidden": false, "delivery": "先行研究の成果を先に述べ、Howeverの前に1秒置く。10〜35 µmは主軸冷却試験の結果として述べる。先行研究が精度未検証だとは言わない。", "ja_sentences": ["従来法には、タッチプローブや変位センサがあります。", "タッチプローブでは、接触したときの機械位置を記録します。", "光学式の装置では、非接触で観察できます。", "カメラでターゲットの模様を撮影し、画像の変化から変位を計算できます。", "大きな利点は、カメラ自体が安価であることです。", "先行研究では、主軸に取り付けた顕微鏡で3次元の熱変位を測定し、静電容量式変位センサとの比較で検証しました。", "ただし、主軸冷却試験では顕微鏡が温められ、Z方向の測定に影響しました。", "その試験で報告されたZ方向の誤差は、10〜35 µmでした。", "著者らは、熱安定性の改善と不確かさ解析を今後の課題に挙げています。", "これらが、先行手法に残る課題です。", "先行研究は熱ドリフトを独立したセンサと比較しています。", "今回の結果は、保存画像による予備的な計算と、指令値との差の評価です。", "条件固定の繰返し測定、独立した基準との比較、不確かさ評価は今後の課題です。"]}, {"page": 4, "title": "Purpose of this study", "en": ["The purpose of this study is to evaluate image-based measurement of relative displacement between the spindle and the worktable.", "To date, we have complete ages": [2], "say": "machining accuracy"}, {"term": "displacement", "ja": "変位", "stress": "dis-PLACE-ment", "count": 15, "pages": [1, 3, 4, 5, 11, 13, 14], "say": "displacement"}, {"term": "measurement", "ja": "測定", "stress": "MEA-sure-ment", "count": 17, "pages": [3, 4, 5, 11, 13, 14], "say": "measurement"}, {"term": "repeatability", "ja": "繰返し性", "stress": "re-peat-a-BIL-i-ty", "count": 1, "pages": [14], "say": "repeatability"}, {"term": "capacitive displacement sensors", "ja": "静電容量式変位センサ", "stress": "ca-PAC-i-tive dis-PLACE-ment SEN-sors", "count": 1, "pages": [3], "say": "capacitive displacement sensors"}, {"term": "microscope", "ja": "顕微鏡", "stress": "MI-cro-scope", "count": 2, "pages": [3], "say": "microscope"}, {"term": "thermal stability", "ja": "熱安定性", "stress": "THER-mal sta-BIL-i-ty", "count": 1, "pages": [3], "say": "thermal stability"}, {"term": "uncertainty", "ja": "不確かさ", "stress": "un-CER-tain-ty", "count": 4, "pages": [3, 4, 14], "say": "uncertainty"}, {"term": "independent reference", "ja": "独立した基準", "stress": "in-de-PEN-dent REF-er-ence", "count": 3, "pages": [11, 12, 14], "say": "independent reference"}, {"term": "calibration", "ja": "校正", "stress": "cal-i-BRA-tion", "count": 5, "pages": [5, 6, 11, 12], "say": "calibration"}, {"term": "pixel scale", "ja": "画素倍率", "stress": "PIX-el SCALE", "count": 1, "pages": [5], "say": "pixel scale"}, {"term": "pitch", "ja": "点や格子の間隔", "stress": "PITCH", "count": 0, "pages": [], "say": "pitch"}, {"term": "rotation center", "ja": "回転中心", "stress": "ro-TA-tion CEN-ter", "count": 2, "pages": [5, 7], "say": "rotation center"}, {"term": "trajectories", "ja": "軌跡（複数）", "stress": "tra-JEC-to-ries", "count": 1, "pages": [5], "say": "trajectories"}, {"term": "Fourier", "ja": "フーリエ", "stress": "FOU-ri-er", "count": 1, "pages": [8], "say": "Fourier"}, {"term": "equivalent", "ja": "相当の・等価の", "stress": "e-QUIV-a-lent", "count": 1, "pages": [14], "say": "equivalent"}, {"term": "micrometers", "ja": "マイクロメートル", "stress": "MI-cro-me-ters", "count": 16, "pages": [3, 6, 8, 10, 11, 12, 13, 14], "say": "micrometers"}, {"term": "command difference", "ja": "指令値との差", "stress": "com-MAND DIF-fer-ence", "count": 1, "pages": [13], "say": "command difference"}, {"term": "pixel shifts", "ja": "画素ずれ", "stress": "PIX-el SHIFTS", "count": 1, "pages": [8], "say": "pixel shifts"}, {"term": "mean scale", "ja": "平均倍率", "stress": "MEAN SCALE", "count": 4, "pages": [6, 8, 11, 13], "say": "mean scale"}, {"term": "GDER", "ja": "ガウス微分エネルギーの比", "stress": "G D E R", "count": 4, "pages": [9], "say": "G D E R"}, {"term": "RMSE", "ja": "二乗平均平方根誤差", "stress": "R M S E", "count": 1, "pages": [14], "say": "R M S E"}, {"term": "RMS", "ja": "二乗平均平方根", "stress": "R M S", "count": 3, "pages": [10, 14], "say": "R M S"}, {"term": "XY", "ja": "X方向とY方向", "stress": "X Y", "count": 4, "pages": [5, 11, 14], "say": "X Y"}, {"term": "FFT-method", "ja": "FFT法", "stress": "F F T method", "say": "F F T method", "count": 1, "pages": [8]}, {"term": "threshold", "ja": "しきい値", "stress": "THRESH-old", "say": "threshold", "count": 0, "pages": []}, {"term": "residual", "ja": "残差", "stress": "re-SID-u-al", "say": "residual", "count": 0, "pages": []}]}</script>
<script>

'use strict';
const DATA=JSON.parse(document.getElementById('practiceData').textContent);
const $=id=>document.getElementById(id), synth=window.speechSynthesis;
let pageIndex=0, voices=[], utterance=null, speakToken=0, activeSentence=-1, playbackMode='idle', isPaused=false, pausedResumeCallback=null;
const status=message=>$('status').textContent=message;
const current=()=>DATA.slides[pageIndex];
const segmenter=typeof Intl.Segmenter==='function'?new Intl.Segmenter('en',{granularity:'sentence'}):null;
const sentenceList=slide=>slide.en.flatMap(p=>segmenter?[...segmenter.segment(p)].map(s=>s.segment):p.split(/(?<=[.!?])\s+(?=[A-Z])/)).map(s=>s.trim()).filter(Boolean);
const sentences=()=>sentenceList(current());
const presentationSlides=()=>DATA.slides.map((slide,index)=>({slide,index})).filter(item=>!item.slide.hidden);
function setTab(name){for(const id of ['practice','vocab']){$(id).hidden=id!==name;$(id+'Tab').setAttribute('aria-selected',String(id===name));}if(name==='vocab')renderWords();}
$('practiceTab').onclick=()=>setTab('practice');$('vocabTab').onclick=()=>setTab('vocab');
function loadVoices(){if(!synth)return;voices=synth.getVoices().filter(v=>/^en(?:-|_)/i.test(v.lang));const old=$('voice').value;$('voice').replaceChildren();if(!voices.length){const o=new Option('English (browser default)','');$('voice').add(o);}else voices.forEach((v,i)=>$('voice').add(new Option(v.name+' / '+v.lang,String(i))));if([...$('voice').options].some(o=>o.value===old))$('voice').value=old;}
if(synth){loadVoices();synth.addEventListener('voiceschanged',loadVoices);}else{for(const id of ['runAll','playFromHere','read','pause','stopSpeech']){const el=$(id);if(el)el.disabled=true;}status('このブラウザは読み上げに対応していません。原稿は表示できます。');}
function highlight(){document.querySelectorAll('.sentence').forEach((el,i)=>el.classList.toggle('active',i===activeSentence));if(activeSentence>=0){const active=document.querySelector('.sentence.active');active?.scrollIntoView({block:'nearest',behavior:'auto'});}}
function stopSpeech(){speakToken++;isPaused=false;pausedResumeCallback=null;activeSentence=-1;utterance=null;playbackMode='idle';if(synth)synth.cancel();const p=$('pause');if(p)p.textContent='一時停止';$('runProgressWrap').hidden=true;highlight();refreshControls();}
function speak(text,index=-1,done=()=>{}){
  if(!synth)return status('読み上げは非対応です。');
  const token=speakToken;
  activeSentence=index;
  highlight();
  utterance=new SpeechSynthesisUtterance(text);
  utterance.lang='en-US';
  utterance.rate=Number($('rate').value);
  if(voices[Number($('voice').value)])utterance.voice=voices[Number($('voice').value)];
  utterance.onend=()=>{
    if(token!==speakToken||isPaused)return;
    done();
  };
  utterance.onerror=e=>{
    if(token!==speakToken||isPaused||e.error==='canceled'||e.error==='interrupted')return;
    speakToken++;
    const wasRun=playbackMode==='presentation';
    playbackMode='idle';
    activeSentence=-1;
    utterance=null;
    highlight();
    refreshControls();
    if(wasRun)$('runLabel').textContent='音声エラーで通し再生を停止しました';
    status('読み上げエラー: '+e.error);
  };
  synth.speak(utterance);
}
function togglePause(){
  if(!synth||playbackMode==='idle')return;
  if(isPaused){
    isPaused=false;
    $('pause').textContent='一時停止';
    status('再生を再開しました。');
    if(synth.paused){try{synth.resume();}catch(_){}}
    if(pausedResumeCallback){const cb=pausedResumeCallback;pausedResumeCallback=null;cb();}
  }else{
    isPaused=true;
    $('pause').textContent='再開';
    status('一時停止中。「再開」を押すと続きから再生します。');
    try{synth.pause();}catch(_){}
    if(synth)synth.cancel();
  }
}
function playSentence(i){
  stopSpeech();
  const token=speakToken;
  playbackMode='sentence';
  const run=()=>{
    if(token!==speakToken)return;
    if(isPaused){pausedResumeCallback=run;return;}
    pausedResumeCallback=run;
    speak(sentences()[i],i,()=>{
      if($('loop').checked){setTimeout(run,600);}
      else{stopSpeech();}
    });
  };
  run();
}
function playAll(){
  stopSpeech();
  const list=sentences(), token=speakToken;
  playbackMode='page';
  let i=0;
  const run=()=>{
    if(token!==speakToken)return;
    if(isPaused){pausedResumeCallback=run;return;}
    if(i>=list.length){stopSpeech();return;}
    const index=i;
    pausedResumeCallback=run;
    speak(list[index],index,()=>{
      i++;
      run();
    });
  };
  run();
}
function playPresentation({fromCurrent=false}={}){
  if(!synth)return status('このブラウザは読み上げ非対応です。');
  stopSpeech();
  setTab('practice');
  playbackMode='presentation';
  const allPages=presentationSlides();
  const pages=fromCurrent?allPages.filter(item=>item.index>=pageIndex):allPages;
  if(!pages.length)return status('再生対象のページがありません。');
  const queue=pages.flatMap((item,pageOrder)=>sentenceList(item.slide).map((text,sentenceIndex)=>({text,sentenceIndex,pageIndex:item.index,pageOrder:fromCurrent?(allPages.findIndex(p=>p.index===item.index)):pageOrder})));
  const token=speakToken;
  let position=0;
  $('runProgressWrap').hidden=false;
  $('runProgress').max=queue.length;
  $('runProgress').value=0;
  const run=()=>{
    if(token!==speakToken)return;
    if(isPaused){pausedResumeCallback=run;return;}
    if(position>=queue.length){
      stopSpeech();
      $('runProgressWrap').hidden=false;
      $('runProgress').value=queue.length;
      $('runLabel').textContent=`再生終了 (${queue.length}文)`;
      status(`通し再生が終了しました。`);
      return;
    }
    const item=queue[position];
    pausedResumeCallback=run;
    if(pageIndex!==item.pageIndex){
      pageIndex=item.pageIndex;
      renderPage({keepSpeech:true});
    }
    $('runProgress').value=position+1;
    $('runLabel').textContent=`${item.pageOrder+1}/${allPages.length}ページ (${position+1}/${queue.length}文)`;
    status(`通し再生中: ${item.pageOrder+1}ページ目。一時停止・再開・停止ができます。`);
    speak(item.text,item.sentenceIndex,()=>{
      position++;
      run();
    });
  };
  run();
}
$('runAll').onclick=()=>playPresentation({fromCurrent:false});
if($('playFromHere'))$('playFromHere').onclick=()=>playPresentation({fromCurrent:true});
$('read').onclick=playAll;
$('stopSpeech').onclick=stopSpeech;
$('pause').onclick=togglePause;
function renderPage({keepSpeech=false}={}){
  if(!keepSpeech)stopSpeech();
  const s=current();$('title').textContent=`${s.page}. ${s.title}`;$('page').value=String(pageIndex);
  $('sentences').replaceChildren();
  sentences().forEach((text,i)=>{
    const row=document.createElement('div');row.className='sentence';
    const b=document.createElement('button');b.textContent='再生';b.setAttribute('aria-label',`${i+1}文目を再生`);b.disabled=!synth;b.onclick=()=>playSentence(i);
    const copy=document.createElement('div');copy.className='sentence-copy';
    const en=document.createElement('p');en.className='english';en.lang='en';en.textContent=text;
    const ja=document.createElement('p');ja.className='translation';ja.lang='ja';ja.textContent=s.ja_sentences[i];
    copy.append(en,ja);row.append(b,copy);$('sentences').append(row);
  });
  $('japanese').replaceChildren();s.ja.forEach(text=>{const p=document.createElement('p');p.textContent=text;$('japanese').append(p);});
  $('cue').textContent=s.delivery;renderWords();refreshControls();
}

DATA.slides.forEach((s,i)=>$('page').add(new Option(`${s.page}. ${s.title}${s.hidden?' [参考・非表示]':''}`,String(i))));
$('page').onchange=()=>{pageIndex=Number($('page').value);renderPage();};
$('prev').onclick=()=>{if(pageIndex>0){pageIndex--;renderPage();}};
$('next').onclick=()=>{if(pageIndex<DATA.slides.length-1){pageIndex++;renderPage();}};

function renderWords(){const query=$('filter').value.trim().toLowerCase();$('words').replaceChildren();let count=0;for(const w of DATA.words){if($('currentOnly').checked&&!w.pages.includes(current().page))continue;if(query&&!`${w.term} ${w.ja}`.toLowerCase().includes(query))continue;count++;const box=document.createElement('article');box.className='word';const b=document.createElement('button');b.textContent=w.term;b.disabled=!synth;b.onclick=()=>{stopSpeech();speak(w.say||w.term,-1,()=>{spoken=false;});};box.append(b);for(const text of [w.ja,w.stress,`原稿に${w.count}回 / ページ ${w.pages.join(', ')}`]){const p=document.createElement('p');p.textContent=text;box.append(p);}$('words').append(box);}if(!count)$('words').textContent='該当する単語はありません。';}
$('filter').oninput=renderWords;$('currentOnly').onchange=renderWords;

function refreshControls(){
  $('prev').disabled=pageIndex===0;$('next').disabled=pageIndex===DATA.slides.length-1;
  for(const id of ['runAll','playFromHere','read','pause','stopSpeech'])$(id).disabled=!synth;
}
const requestedPage=Number(new URL(location.href).searchParams.get('page'));
const requestedIndex=DATA.slides.findIndex(s=>s.page===requestedPage);
if(requestedIndex>=0)pageIndex=requestedIndex;
window.addEventListener('pagehide',stopSpeech);
renderPage();refreshControls();
</script></html>

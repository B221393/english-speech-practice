<script id="qaData" type="application/json">[{"id": "q01", "category": "目的・比較", "priority": "A", "pages": [2, 4, 14], "question": "何を測る研究で、今回どこまでできたのか？", "question_en": "What do you measure, and what have you achieved so far?", "answer_en": "My goal is to measure relative displacement between the spindle and the worktable from images. This presentation reports the measurement system, algorithms, and analysis of saved images.", "answer_ja": "主軸とテーブルの相対変位を画像から求めることが目的で、今回は装置・計算方法・保存画像の解析結果を示しています。", "details": ["求めたい量は機械座標系の相対変位ΔX・ΔY・ΔZです。カメラが直接出力するのは画像と画像座標の変化なので、画素から長さへの換算と座標軸の対応が必要です。", "今回の結果は、指令移動で取得した保存画像を用いた解析です。熱による実変形を運転中に連続測定し、独立基準で検証した段階とは区別して説明します。", "準備したもの、保存画像から計算できたもの、次に検証するものの順に答えると、現在の到達点が伝わります。"], "sources": ["発表2・4・14ページ"]}, {"id": "q02", "category": "目的・比較", "priority": "A", "pages": [3, 5], "question": "タッチプローブや変位センサがあるのに、なぜカメラを使うのか？", "question_en": "Why use a camera instead of a touch probe or a displacement sensor?", "answer_en": "A camera provides noncontact observation and records a target pattern for later analysis. I am evaluating whether this approach can measure the required displacement under the intended conditions.", "answer_ja": "非接触で模様を記録し、後から解析できることに着目しています。既存の測定器より優れていると断定する段階ではありません。", "details": ["タッチプローブは接触時の位置を、変位センサはそのセンサの測定原理に基づく変位を得ます。カメラ方式では画像から変位を計算するため、特徴や誤差要因が異なります。", "カメラ本体の価格だけで比較せず、レンズ、照明、取付・調整機構、PC、校正に要する費用も比較対象に含めます。", "価格、測定範囲、繰返し性、熱安定性、取付条件を同じ目的に対して比較する必要があります。スライドの価格と繰返し性の数字だけで方式全体の優劣は決めません。"], "sources": ["発表3・5ページ"]}, {"id": "q03", "category": "目的・比較", "priority": "A", "pages": [3, 4, 14], "question": "先行研究でも3次元熱変位を測っている。今回の独自性は何か？", "question_en": "How does your work differ from the previous study?", "answer_en": "I am developing and evaluating my own measurement system and displacement algorithms. I have not yet demonstrated better accuracy or thermal stability than the previous system.", "answer_ja": "今回の装置構成と計算方法を設計・評価している点を説明し、先行研究を上回る性能を既に実証したとは言わない形にします。", "details": ["先行研究の成果は3次元熱変位の測定と独立したセンサによる検証です。著者名はスライドの出典で示し、口頭では先行研究として説明できます。", "今回示せる具体物は、装置とターゲットの構成、画素倍率・回転中心・XY・Zの処理、および保存画像の結果です。", "新規性を問われたら、構成や条件の違いと、今後どの比較で差を確認するかを分けます。低価格や高精度という言葉だけを新規性の根拠にしないようにします。"], "sources": ["発表3・4・14ページ"]}, {"id": "q04", "category": "目的・比較", "priority": "B", "pages": [5, 6, 7, 9], "question": "Target AとTarget Bを分けているのはなぜか？", "question_en": "Why do you use two targets?", "answer_en": "Target A is used for pixel-scale and rotation-center calibration. Target B is used for in-plane XY and out-of-plane Z displacement measurement.", "answer_ja": "校正用のAと、変位測定用のBで役割を分けています。", "details": ["Target Aでは既知のドット間隔と回転時のドット軌跡を利用します。前者は画素倍率、後者は画像上の回転中心を求める情報になります。", "Target Bでは画像間の模様のずれをXY変位に、ピントに応じた画像指標の変化をZ変位に結びつけます。", "ターゲットを変更したときも同じ倍率や取付条件をそのまま使えるとは限りません。撮影倍率、距離、光軸、取付の再現性を確認する項目として説明します。"], "sources": ["発表5〜9ページ"]}, {"id": "q05", "category": "校正・格子", "priority": "A", "pages": [6, 12], "question": "200µmという既知間隔は真値なのか？", "question_en": "Is the 200-micrometer target pitch an independently verified reference?", "answer_en": "I use 200 micrometers as the known target pitch in this calculation. Its manufacturing tolerance and traceability must be included when evaluating the uncertainty of the scale.", "answer_ja": "計算上の既知間隔として200µmを使っていますが、その値の公差や校正証明まで確認できたと同一視しないことが重要です。", "details": ["倍率は既知間隔を画素間隔で割って求めるため、既知間隔の誤差は倍率に直接影響します。基準長の不確かさをゼロと仮定したまま実位置精度を主張できません。", "説明時は、設計値・仕様値・独立測定値のどれに基づく200µmなのかを資料で確認して答えます。この発表データだけから校正証明の有無は断定しません。", "今後の確認資料はターゲットの仕様、製作公差、基準測定の記録です。これらが未確認なら、未確認の項目として具体的に示します。"], "sources": ["発表6・12ページ", "校正_発表用9件.csv"]}, {"id": "q06", "category": "校正・格子", "priority": "A", "pages": [6, 12], "question": "画素倍率0.856666µm/pxはどう計算したのか？", "question_en": "How did you calculate the pixel scale?", "answer_en": "I divide the known 200-micrometer pitch by the fitted pitch in pixels. The provisional mean of the first nine calibration records is approximately 0.856666 micrometers per pixel.", "answer_ja": "格子から推定した画素単位の間隔で200µmを割り、発表対象9件の倍率を平均しています。", "details": ["1画像の例では、画素間隔が約233.49pxなら倍率は約0.8566µm/pxです。6ページの単一画像の表示値0.856559µm/pxと、12・13ページの9件平均0.856666µm/pxを区別します。", "発表用9件CSVから再計算した平均は0.8566656508µm/pxです。スライドでは0.856666µm/pxに丸めています。", "モデルの格子間隔を使う方法と、隣接距離を単純平均する診断値は別です。今回の平均値は格子モデルによる9件の倍率から計算しています。"], "formula": "s = P / d\nP = 200 µm, d: fitted pitch in pixels\nmean(s₁,…,s₉) = 0.8566656508 µm/px", "sources": ["発表6・12ページ／仕様補足22ページ", "校正_発表用9件.csv"]}, {"id": "q07", "category": "校正・格子", "priority": "A", "pages": [6], "question": "隣接点は具体的にどう選ぶのか？", "question_en": "How do you select neighboring dots?", "answer_en": "Two dots must occupy adjacent grid cells in the same row or column. Their center distance must also be between 0.8 and 1.3 times the fitted pitch.", "answer_ja": "格子上で上下左右に1セルだけ離れ、中心間距離も所定範囲に入る点だけを隣接とします。", "details": ["点を回転補正した格子座標へ割り当てた後、行番号が同じで列番号が1違う、または列番号が同じで行番号が1違う組を探します。最も近い点を無条件につなぐ方法ではありません。", "さらに、中心間距離dが0.8p以上1.3p以下であることを確認します。pは格子モデルで推定した画素単位の間隔です。", "右と下のセルだけを探索して、同じ辺を2回数えないようにしています。各点の隣接数は最大4です。表示例は31点・48辺です。"], "formula": "(|Δrow|, |Δcol|) = (1,0) or (0,1)\n0.8 p ≤ distance ≤ 1.3 p\nmaximum degree = 4", "sources": ["発表6ページ／仕様補足21ページ", "func_pixel_scale.py:514–534"]}, {"id": "q08", "category": "校正・格子", "priority": "B", "pages": [6], "question": "斜めの点や、欠けた点の先をつながないのはなぜか？", "question_en": "Why do you exclude diagonal links and links across missing dots?", "answer_en": "The reference distance is one horizontal or vertical grid pitch. Diagonal links and links across a missing cell represent different distances and are excluded.", "answer_ja": "200µmに対応する上下左右1格子分の距離を使うためです。", "details": ["正方格子の斜め1セルは約√2p、1点抜けた先は約2pです。これを1ピッチとして200µmで割ると倍率を誤ります。", "格子セル差の条件により斜めや欠測の飛び越しを除外し、距離条件も併用します。上限1.3pは理想格子の斜め距離√2pより小さい値です。", "欠けた格子点は補間して作りません。欠測は欠測のまま扱い、実際に検出した点と有効な接続だけで計算します。"], "sources": ["仕様補足20・21ページ", "func_pixel_scale.py:499–534"]}, {"id": "q09", "category": "校正・格子", "priority": "B", "pages": [6], "question": "同じドットを複数検出した場合はどう除くのか？", "question_en": "How do you reject duplicate dot centers?", "answer_en": "Centers that are too close are suppressed, and only one center is retained in each grid cell. The grid fit is repeated after rejecting inconsistent points.", "answer_ja": "近接しすぎる中心と同じ格子セルの重複を除いてから再推定します。", "details": ["近接判定では、0.8pと2点の測定半径の和のうち大きい方より距離が小さければ競合とします。半径を与えた場合、同じドット内部の複数中心を格子間隔の候補にしないためです。", "同じ整数格子セルに複数点が入った場合は、モデル残差が小さい候補を優先し、同程度なら半径などの順序で1点を残します。", "モデル残差が0.2pを超える点も除外し、残った点でモデルを再推定します。点数が不足すれば、無理に倍率を返さず計算を止める仕様です。"], "sources": ["仕様補足20ページ", "func_pixel_scale.py:399–510"]}, {"id": "q10", "category": "校正・格子", "priority": "A", "pages": [6], "question": "しきい値110と既定値160は矛盾していないか？", "question_en": "Why is the reprocessing threshold 110 while the default is 160?", "answer_en": "The saved calibration images were reprocessed at a threshold of 110. The runtime default of 160 was not changed; these are different processing conditions.", "answer_ja": "保存画像の再処理条件110と実行時の既定値160を区別して説明します。", "details": ["保存校正画像の再処理は、8bit灰度画像に9×9のGaussian平滑化を行い、その後の明るさが110を超える画素を前景とする条件です。", "続いて7×7の楕円カーネルによるclosing、外側輪郭の抽出、面積・円形度による選別を行います。処理段階が異なれば検出方法も異なるため、全処理が110を使うとは言いません。", "今回の再計算で装置の既定値160を変更したわけではありません。110が全撮影条件で最適と実証されたわけでもないため、照明・露光・焦点を固定した条件での検証を別途準備します。"], "sources": ["仕様補足19ページ", "func_pixel_scale.py:140–180", "校正_発表用9件.csv"]}, {"id": "q11", "category": "校正・格子", "priority": "B", "pages": [6], "question": "面積・円形度の条件と重心の計算式は？", "question_en": "What are the contour-selection and centroid conditions?", "answer_en": "Contours are filtered by area and circularity. Their centers are calculated from image moments, with circularity required to be at least 0.55.", "answer_ja": "面積範囲と円形度を満たした輪郭について、画像モーメントから中心を求めます。", "details": ["現行コードの既定最小面積は500px²、最大面積は10000px²です。画像サイズ適応が有効な経路では、実効最小面積を下式で決めます。固定の500と実効値を混同しません。", "円形度は4πA/P²で計算し、0.55未満は除外します。Aは輪郭面積、Pは周長です。面積や周長が退化した輪郭も除外します。", "中心はx=m10/m00、y=m01/m00です。表示用の円の大きさと、実際に測った輪郭半径・面積は別の量です。"], "formula": "Amin = min(500, max(50, 0.0002 W H)) px²\nAmin ≤ A ≤ 10000 px²\n4πA/P² ≥ 0.55\nx = m10/m00, y = m01/m00", "sources": ["仕様補足19ページ", "func_pixel_scale.py:140–180"]}, {"id": "q12", "category": "校正・格子", "priority": "B", "pages": [6, 7], "question": "12%除外と180pxマージンは同じ条件か？", "question_en": "Are the 12-percent exclusion and the 180-pixel margin the same condition?", "answer_en": "No. The 12-percent exclusion is applied to the calibration-point bounding box. The 180-pixel margin is applied to rotation tracks inside the image.", "answer_ja": "校正点群の外接矩形に対する12%と、追跡点の画像端からの180pxは別条件です。", "details": ["校正では、検出点群の外接矩形の各辺から内側12%の範囲に入る外周点を除きます。画像全体の幅・高さの12%とは限りません。", "回転軌跡の安定点選別では、追跡された各点が全区間で画像端から180px以内へ入らないことを確認します。", "両者は対象データ、基準となる領域、単位が異なります。片方の値をもう片方へ換算して置き換えたわけではありません。"], "sources": ["発表6・7ページ／仕様補足19・23ページ", "func_rotate.py:45–70"]}, {"id": "q13", "category": "校正・格子", "priority": "B", "pages": [6, 12], "question": "格子が回転していても倍率を求められるのはなぜか？", "question_en": "How do you account for a rotated grid?", "answer_en": "I fit the detected centers to a rotated square-grid model. The magnitude of the fitted grid vector gives the pitch in pixels, independently of its orientation.", "answer_ja": "格子の回転を含むモデルを当てはめ、格子ベクトルの長さから間隔を求めています。", "details": ["候補となる隣接方向を4倍角で平均し、4方向対称性を使って初期姿勢を求めます。角度の整合性指標が0.5未満なら不安定として止めます。", "回転補正した座標を整数セルへ割り当て、複素数の最小二乗モデルで原点と格子ベクトルaを推定します。|a|が画素単位の1ピッチになります。", "少なくとも2行・2列・8辺を含むことなどを幾何検査します。このモデルは正方格子と1つの倍率を仮定するため、レンズ歪みや縦横倍率差まで自動的に補正するものではありません。"], "formula": "zᵢ ≈ z₀ + a(cᵢ + i rᵢ)\np = |a|, s = 200 / p", "sources": ["仕様補足20・22ページ", "func_pixel_scale.py:458–576"]}, {"id": "q14", "category": "校正・格子", "priority": "A", "pages": [6, 12], "question": "なぜ9件平均なのか。ばらつきが小さければ高精度と言えるか？", "question_en": "Why use nine records, and does the small spread prove accuracy?", "answer_en": "The displayed mean uses calibration records one through nine. Their small spread describes consistency within this saved dataset; it does not by itself establish physical accuracy.", "answer_ja": "発表で対象にした1〜9件の平均と、その集合内の一貫性を示す値です。小さいばらつきだけでは実位置精度を証明できません。", "details": ["9件の倍率は0.856648〜0.856677µm/pxです。表示例の1画像と、集計対象9件の平均を混同しないよう、記録番号をCSVで示します。", "この9件を選んだ基準が統計的に最適、あるいは全条件を代表するとまでは資料だけで断定しません。選定基準、除外理由、全記録との関係を説明できるようにします。", "同じ模様・似たフレーム・同じモデルのデータでは誤差が相関する可能性があります。基準ピッチの誤差、モデルの系統誤差、撮影条件の影響は別に評価します。"], "sources": ["発表6・12ページ／仕様補足17・22ページ", "校正_発表用9件.csv"]}, {"id": "q15", "category": "回転・XY", "priority": "B", "pages": [7], "question": "回転中心は何のために求め、何を確認したのか？", "question_en": "Why estimate the rotation center, and what did you verify?", "answer_en": "The rotation center locates the rotation axis in image coordinates. The displayed example uses fourteen dots tracked over 486 recorded frames.", "answer_ja": "画像上で回転軸の中心を求めるためで、表示例では486フレームを通して追跡できた14点を使っています。", "details": ["回転するドットの円弧軌跡から共通の中心を推定します。複数の軌跡を使うことで、単一の点だけに依存しない情報を得ます。", "有効追跡の一般条件と、今回の図で全486フレームを通して追跡できた14点という選別結果は分けて答えます。", "円弧が短い場合や特定方向に点が偏る場合、中心推定は不安定になり得ます。中心座標が求まったことと、その物理的な不確かさが評価済みであることは別です。"], "sources": ["発表7ページ／仕様補足23ページ", "S06_採用軌跡.json"]}, {"id": "q16", "category": "回転・XY", "priority": "B", "pages": [7], "question": "ドットはどう対応付けるのか。35pxと30フレームの意味は？", "question_en": "How are dots matched between frames?", "answer_en": "Each track is matched to the nearest unused center less than 35 pixels away. Tracks with at least thirty points satisfy the minimum-length condition; the displayed example uses full-length tracks.", "answer_ja": "未使用の検出点のうち35px未満で最も近い点へ対応付け、最低30フレームを有効条件にしています。", "details": ["35pxはフレーム間の中心移動距離の上限です。実装は厳密な小なり比較なので、35pxちょうどを含む『35px以下』とは言いません。", "一般の有効長は30フレーム以上ですが、今回の説明図では全486フレームを通して追跡できる点を選んでいます。", "最近傍対応は大移動、欠測、点の接近で取り違えが起こり得ます。この条件だけで、全速度・全照明下の追跡精度が保証されるわけではありません。"], "sources": ["発表7ページ／仕様補足23ページ", "func_rotate.py:73–132"]}, {"id": "q17", "category": "回転・XY", "priority": "A", "pages": [8], "question": "FFT-methodでは、実際には何を計算しているのか？", "question_en": "What does the FFT method actually calculate?", "answer_en": "I calculate the Fourier transforms, normalize the cross-power spectrum, and find the peak of the inverse transform. The peak location gives the image shift.", "answer_ja": "FFT、相互パワースペクトルの正規化、逆FFT、ピーク位置の探索で画像間の移動を求めます。", "details": ["スライドのFFT-methodは広い呼び方です。質問された場合は、正規化した相互パワースペクトルを用いる位相限定相関の処理だと具体的に説明します。", "実装はconj(F1)F2を用い、振幅で正規化した後、実部の逆FFTで相関面を求めます。ゼロ付近の除算を避けるepsilonは10⁻¹²です。", "画像サイズの一致が必要で、循環相関の折返し、周期模様による複数ピーク、低コントラストには注意します。コードにサブピクセル補間があることと、今回の整数値の記録でその性能を実証したことは別です。"], "formula": "F₁ = FFT2(I₁), F₂ = FFT2(I₂)\nC = conj(F₁)F₂\nR = C / (|C| + ε) if |C| > ε; otherwise 0\nε = 10⁻¹²\nc = Re[IFFT2(R)]\n(Δu, Δv) = peak position of c", "sources": ["発表8ページ／仕様補足23ページ", "func_xy.py:102–153"]}, {"id": "q18", "category": "回転・XY", "priority": "A", "pages": [8, 13], "question": "X方向100µmなのに、画像では−108pxと＋44pxになるのはなぜか？", "question_en": "Why do both image coordinates change for an X-axis command?", "answer_en": "The camera axes can be rotated relative to the machine axes. I use the pixel-shift magnitude for the reported displacement length; machine-axis components require a separate coordinate mapping.", "answer_ja": "画像軸と機械軸の向きが異なるためで、今回の長さ換算は2成分のノルムを使っています。", "details": ["画像の横変位だけを機械X変位と同一視できません。単一の倍率と平面内回転を仮定すれば、画像変位の長さは√(Δu²+Δv²)で求められます。", "この例は√(108²+44²)≒116.619pxで、平均倍率を掛けると約99.90µmです。符号付きの画像成分と、正の変位長を区別して答えます。", "各機械軸の符号付き成分を求める場合は、既知の機械移動と画像移動から座標変換を確認します。1つの倍率だけで傾き・レンズ歪み・異方性まで解決したとは言いません。"], "formula": "L = s√(Δu²+Δv²)\n= 0.8566656508 × √(108²+44²)\n≈ 99.90 µm", "sources": ["発表8・13ページ", "13ページ_指令値と測定値.csv"]}, {"id": "q19", "category": "回転・XY", "priority": "A", "pages": [11, 13], "question": "12件の測定は、同じ条件を12回繰り返した結果か？", "question_en": "Are these twelve repeated measurements under one condition?", "answer_en": "No. The dataset combines eight X measurements and four Y measurements with several commanded displacements. It should not be treated as twelve repeats under one condition.", "answer_ja": "X8件・Y4件と複数の指令変位をまとめた集合で、同一条件12回の繰返し試験として扱いません。", "details": ["同じ指令値の記録が一部含まれていても、集合全体には軸と指令長の違いがあります。各条件の件数を元記録と対応付けて説明します。", "13ページの表示順はX1〜X8、Y1〜Y4で、元の取得番号とは別です。表示ラベルとoriginal_recordをCSVで追跡できます。", "繰返し性を評価するには、軸、指令長、移動方向、撮影・取付条件を固定した反復データを用意し、条件内のばらつきを求めます。"], "sources": ["発表11・13ページ／仕様補足18ページ", "13ページ_指令値と測定値.csv"]}, {"id": "q20", "category": "回転・XY", "priority": "A", "pages": [13, 14], "question": "RMSE 0.41µm、最大差0.78µmなら、1µm精度を証明したのか？", "question_en": "Do these errors prove sub-micrometer positioning accuracy?", "answer_en": "These values are differences from commanded displacement after converting saved pixel shifts. They do not by themselves establish accuracy against an independent position reference.", "answer_ja": "保存画素差を換算した値と指令値との差であり、独立した実位置基準に対する精度の証明ではありません。", "details": ["各記録でe=L−Cを計算しています。Cは指令変位、Lは同じ画素差に平均倍率を掛けた長さです。指令値そのものを誤差ゼロの実移動量とは仮定できません。", "現在の12件CSVを再計算するとRMSEは約0.40818µm、最大絶対差は約0.78271µmです。スライドでは0.41µm・0.78µmに丸めています。", "百分率は100(L−C)/Cで、今回の範囲は約−0.52〜＋0.59%です。独立基準との同時比較と条件固定の反復試験を次に用意します。"], "formula": "eᵢ = Lᵢ − Cᵢ\nRMSE = √mean(eᵢ²)\ne% = 100(L−C)/C", "sources": ["発表13・14ページ", "13ページ_指令値と測定値.csv"]}, {"id": "q21", "category": "回転・XY", "priority": "B", "pages": [11, 13], "question": "旧倍率0.869733と平均倍率0.856666で結果が変わる理由は？", "question_en": "Why does changing the pixel scale change the displacement result?", "answer_en": "The same saved pixel-shift length is multiplied by a different scale. This changes the converted displacement proportionally; it is not a new image measurement.", "answer_ja": "同じ画素差に掛ける倍率が違うためで、新しい撮影や画素差の再測定を行ったことにはなりません。", "details": ["L=spなので、画素変位長pが同じなら倍率sの差が長さLへ比例して反映されます。2つの倍率の差はおよそ1.5%です。", "倍率を変更して指令値との差が小さくなったことだけで、新しい倍率が正しいと結論づけないようにします。指令値への一致と基準長の妥当性は別に確認します。", "比較では画素差、対象記録、誤差定義を揃えて、換算のどの要素を変更したのかを明示します。"], "sources": ["発表11・13ページ", "13ページ_指令値と測定値.csv"]}, {"id": "q22", "category": "Z・RMS", "priority": "A", "pages": [9], "question": "GDERとは何か。なぜピントの指標になるのか？", "question_en": "What is GDER, and why is it related to focus?", "answer_en": "GDER is the mean energy of Gaussian-derivative responses in the horizontal and vertical directions. It measures image sharpness and changes as the target moves through focus.", "answer_ja": "横・縦のGaussian微分応答のエネルギーを平均した、画像の鮮明さを表す指標です。", "details": ["現行の既定窓は15×15画素で、半径7からsigma=7/2.5=2.8画素を用います。横応答Gxと縦応答Gyの二乗和を画像上で平均します。", "輪郭が鮮明な画像では空間微分の応答が大きくなり、ピンぼけでなだらかになると指標が変化します。ただし、模様、照明、露光、ノイズにも影響されます。", "GDERの値を1つ見ただけでZ位置が一意に決まるとは限りません。今回の方法はZ走査に対する曲線どうしを比較して横ずれを求めます。"], "formula": "GDER = mean(Gx² + Gy²)\nwindow = 15×15 pixels, σ = 2.8 pixels", "sources": ["発表9ページ／仕様補足24ページ", "func_z.py:13–60"]}, {"id": "q23", "category": "Z・RMS", "priority": "A", "pages": [9, 10], "question": "GDERの最大位置だけでなく、曲線全体をRMSで比べる理由は？", "question_en": "Why align whole focus curves instead of comparing only their peaks?", "answer_en": "Curve alignment uses information from the overlapping part of both responses. I select the offset that minimizes their RMS difference, assuming the curve shapes remain comparable.", "answer_ja": "重なり区間の曲線形状を使って位置合わせし、RMS差が最小になるずれを選びます。", "details": ["最大値の位置だけを使うと、ピーク付近の平坦さや局所的なノイズの影響を受けます。曲線比較は複数のサンプルを利用する方法として説明できます。", "一方、2本の曲線形状が大きく変わると、最小RMSの位置を単純に高さ差と解釈できません。照明や姿勢の変化が形状に与える影響を確認する必要があります。", "この選択理由と、ピーク法より統計的に優れていると実証したことは分けます。方法比較を行っていなければ、その優劣まで主張しません。"], "sources": ["発表9・10ページ／仕様補足24ページ"]}, {"id": "q24", "category": "Z・RMS", "priority": "B", "pages": [10], "question": "正規化は最大値割りか、min–maxか？", "question_en": "Which normalization was used for the displayed RMS result?", "answer_en": "The displayed result divides each stored curve by its own maximum. The current helper function uses min–max normalization, which is a separate processing path.", "answer_ja": "発表の表示結果は各曲線の最大値で割る処理です。現行の補助関数のmin–max正規化とは区別します。", "details": ["表示結果の再計算はf/max(f)を使っています。これに対してmin–maxは(f−min(f))/(max(f)−min(f))で、最小値の扱いが異なります。", "最大値割りは振幅スケールの差を抑える処理ですが、最小値や背景の違いまで同じにする処理ではありません。", "質問された場合は、発表結果を作った処理経路と現在の関数を取り違えずに答えます。違う前処理の結果を同一条件の比較として混ぜません。"], "formula": "Displayed result: f / max(f)\nCurrent helper: (f − min(f)) / (max(f) − min(f))", "sources": ["仕様補足24ページ", "再指摘_20261020/prepare.py:47–57", "func_z.py:63–86"]}, {"id": "q25", "category": "Z・RMS", "priority": "B", "pages": [10], "question": "RMSの計算範囲と探索範囲は？ 重なりが減ってもよいのか？", "question_en": "What is the RMS search range, and how is overlap handled?", "answer_en": "The displayed sweep uses integer offsets from zero to 134 and evaluates RMS only on the overlap. The minimum is at 66 intervals, with 273 overlapping samples.", "answer_ja": "0〜134の整数ずれを探索し、その時点で重なる部分だけでRMSを計算しています。", "details": ["RMS(k)=√mean((f−g)²)を各ずれkの重なり区間で計算します。現在の最小値はk=66、RMS≒0.001944、重複サンプル数273です。", "ずれによって使う区間とサンプル数が変わるため、小さいRMSだけで全てのずれを同じ信頼度と見なせません。重複数と曲線の形状も確認します。", "今後は最小重複数、同じ支持区間での比較、近傍の極小との差などを確認項目にできます。現行結果で実施済みの処理と今後の評価案を区別します。"], "formula": "RMS(k) = √[Σ(fⱼ−gⱼ)² / N(k)]\nk = 0,…,134\nbest k = 66, N(66) = 273", "sources": ["発表10ページ／仕様補足24ページ", "Z_RMS_135点.json"]}, {"id": "q26", "category": "Z・RMS", "priority": "A", "pages": [10], "question": "66フレーム間隔が98.21µmになる計算を説明してほしい。", "question_en": "How do 66 frame intervals correspond to 98.21 micrometers?", "answer_en": "At the commanded feed of five millimeters per minute and the capture setting of 56 frames per second, one interval corresponds to about 1.488 micrometers. Sixty-six intervals give 98.21 micrometers.", "answer_ja": "指令送り速度を1フレーム間隔の長さへ換算し、66を掛けています。", "details": ["5mm/minをµm/sへ直すと5000÷60≒83.333µm/sです。これを56fpsで割ると約1.488095µm/間隔になります。", "66×1.488095≒98.214286µmなので、表示は98.21µmです。枚数とフレーム間隔数を混同しないようにします。", "これは指令送り速度と撮影設定を使った換算値です。実速度や画像時刻と位置の対応を独立に確認した値として説明しないことが重要です。"], "formula": "v = 5000 / 60 = 83.333… µm/s\nΔz = v / 56 = 1.488095… µm/interval\nZ = 66 Δz = 98.214285… µm", "sources": ["発表10ページ／仕様補足24ページ", "Z_RMS_135点.json"]}, {"id": "q27", "category": "Z・RMS", "priority": "A", "pages": [9, 10, 11], "question": "500枚・56fpsと500µm・5mm/minでは時間が合わないのでは？", "question_en": "Are the image count and the commanded scan duration consistent?", "answer_en": "Five hundred images span about 8.91 seconds at 56 frames per second, whereas a 500-micrometer move at five millimeters per minute takes six seconds. I need timestamps and motion records to identify the corresponding constant-speed interval.", "answer_ja": "設定値をそのまま同じ区間と見なすと時間差があります。撮影と移動の対応区間を記録で確認する必要があります。", "details": ["500枚の最初から最後までは499間隔なので、499÷56≒8.91秒です。500µmを5mm/minで送る指令上の所要時間は6秒です。", "撮影の前後に静止区間が含まれたのか、開始・停止のタイミングや設定の対応が異なるのかは、設定値だけでは特定できません。原因を推測で断定しません。", "画像タイムスタンプと実際の位置・速度記録を対応付け、定速区間を確認することが次の検証です。この差がある状態で、全フレームを実移動の等間隔サンプルと保証することはできません。"], "formula": "image span = (500−1)/56 ≈ 8.91 s\nnominal move time = 500/(5000/60) = 6.00 s", "sources": ["発表9〜11ページ", "保存枚数・撮影設定・送り指令からの再計算"]}, {"id": "q28", "category": "結果・検証", "priority": "A", "pages": [10, 11, 14], "question": "Zの−1.79%を誤差や精度と呼んでよいか？", "question_en": "What does the minus 1.79-percent Z difference mean?", "answer_en": "It is the difference between the converted 98.21-micrometer result and the 100-micrometer height setting. It is one result from one pair of scans, not an uncertainty estimate.", "answer_ja": "設定100µmと換算結果との差率であり、1組の走査から得た1結果です。", "details": ["差率は100×(98.214286−100)/100≒−1.79%です。比較基準が初期高さの設定値であることを明示します。", "1組の走査だけでは、繰返しばらつきや信頼区間は求められません。この差率を標準偏差や測定不確かさと呼ばないようにします。", "実位置基準との同時比較、複数回の反復、速度・撮影時刻の対応確認を用意し、系統的なずれとランダムな変動を分けます。"], "sources": ["発表10・11・14ページ", "Z_RMS_135点.json"]}, {"id": "q29", "category": "結果・検証", "priority": "A", "pages": [12, 13, 14], "question": "不確かさには何を含め、次に何と比較するのか？", "question_en": "What uncertainty sources and reference measurements will you evaluate?", "answer_en": "I will evaluate target-pitch uncertainty, image processing, mounting stability, and synchronization. I will also compare repeated measurements with an independent position reference under fixed conditions.", "answer_ja": "基準長・画像処理・取付・同期の影響を分け、条件を固定した反復と独立位置基準との比較を進めます。", "details": ["XYでは基準ピッチと倍率の不確かさ、中心や画素ずれの推定、レンズ歪み、取付方向、熱や振動の影響が候補です。L=spならsとpの影響を分けて考えます。", "Zでは焦点曲線の再現性、正規化と位置合わせ、照明・露光、実送り速度、撮影時刻と位置の同期が候補です。今回の数値だけで寄与率を決めません。", "比較用センサは必要な範囲・分解能・不確かさ・同期方法を確認して選びます。特定機器での比較が実施済みであるかのようには答えません。"], "sources": ["発表12〜14ページ"]}, {"id": "q30", "category": "結果・検証", "priority": "A", "pages": [14], "question": "次にどの実験を行えば、主張を強くできるのか？", "question_en": "Which experiments will you do next?", "answer_en": "I will repeat XY measurements under fixed conditions and test broad Z scans and fine Z steps. I will compare the results with a reference and check synchronization before measuring actual thermal deformation.", "answer_ja": "条件固定のXY反復、広いZ走査と細かいZステップ、基準比較と同期確認を順に準備します。", "details": ["XYは軸・移動方向・指令長・撮影条件を固定した繰返しで、条件内のばらつきと方向依存を評価します。複数条件を混ぜたRMSEとは別に示します。", "Zは広い範囲で曲線形状と位置合わせの成立範囲を確認し、細かいステップで識別性と再現性を調べます。最小RMSだけでなく重なりと極小の一意性も見ます。", "画像時刻と位置の対応を確認し、独立基準との比較を経て、検証した条件を実際の熱変形測定へ適用します。実施順序や条件は指導教員と結果を見て詰めます。"], "sources": ["発表14ページ"]}, {"id": "q31", "category": "結果・検証", "priority": "B", "pages": [6, 7, 8, 10], "question": "どのような場合に結果を採用しないのか？", "question_en": "When would you reject a measurement result?", "answer_en": "I would reject or review results with insufficient dots, inconsistent grid geometry, unreliable image correlation, or an ambiguous curve-alignment minimum. A computed number alone is not sufficient for acceptance.", "answer_ja": "点・格子・相関・曲線位置合わせの成立条件を確認し、数字が出ただけでは採用しません。", "details": ["格子では10点未満、姿勢の整合性不足、必要な行・列・辺の不足などを確認します。点を増やすために欠測を埋めたり、しきい値をその場で勝手に緩めたりしません。", "FFTでは相関ピーク低下や循環折返しの警告を確認します。焦点曲線では形状変化、重複不足、複数の同程度の極小がある場合を調べます。", "既存コードの判定、保存結果で確認できる事実、これから追加する採否基準を区別します。全ての判定が今回のデータで実運用済みだったとは言いません。"], "sources": ["仕様補足20〜24ページ", "func_pixel_scale.py／func_xy.py"]}, {"id": "q32", "category": "結果・検証", "priority": "B", "pages": [14], "question": "未確認の質問を受けたとき、どう答えるか？", "question_en": "How will you answer a question that you have not evaluated yet?", "answer_en": "I have not evaluated that point yet. I can explain the current calculation, and I will check the required data before making a conclusion.", "answer_ja": "分かっている計算内容と、まだ確認していない事実を分けて答えます。", "details": ["まず何が未確認なのかを具体的に答えます。例として、基準ピッチの校正証明、実速度、画像と位置の同期、条件固定の繰返し回数などがあります。", "続いて、現時点で示せる式・設定・保存結果を説明します。質問の答えにならない一般論や、確かめていない原因の断定で埋めないようにします。", "最後に、どの記録や実験で確認するかを述べます。質問の意図が不明な場合は、Could you clarify which condition you mean? と対象条件を確認できます。"], "sources": ["発表14ページ／質疑応答の準備"]}, {"id": "q33", "category": "校正・格子", "priority": "A", "question": "なぜ画素倍率の有効数字が6桁（0.856666µm/px）なのか？物理的に有意なのか？", "question_en": "Why is the pixel scale given to six digits (0.856666 µm/px)? Is six-digit precision physically justified?", "answer_en": "The six digits are an internal calculation value used to prevent rounding errors during displacement conversion. Physically, the effective precision is about three to four digits (around 0.857 µm/px), and evaluating the true measurement uncertainty is the next planned stage.", "answer_ja": "6桁の数値は変位計算時の丸め誤差を防ぐための計算値です。物理的な有効精度としては3〜4桁（約0.857µm/px）が妥当であり、真の不確かさの評価は次の課題です。", "details": ["変位計算 L = s · √(Δu² + Δv²) において、数百画素の変位を掛ける際、倍率を粗く丸めると0.4〜1µm以上の計算誤差（桁落ち）が生じるため、計算機内部では6桁の値を保持しています。", "格子点群（31点・48本の隣接線）と複数画像（9件）の統計平均により平均値の推定量として桁数が多く算出されますが、これは物理的な測定限界とは区別されます。", "ターゲットの格子製作公差、熱膨張、光学歪み、二値化閾値感度を考慮すると、工学的に保証できる有効数字は3〜4桁（相対精度約0.1%）です。スライド4の通り、この信頼限界を解明する「不確かさ評価」を今後の最重要課題としています。"], "formula": "L = s · √(Δu² + Δv²)\nInternal precision: s = 0.856666 µm/px (prevents ~0.4 µm rounding error)\nPhysical effective precision: ~3-4 digits (s ≈ 0.857 µm/px, ~0.1% uncertainty)", "sources": ["発表用の図/校正_発表用9件.csv", "1002_研究/actual_code/functions/func_pixel_scale.py", "Slide 4 (Purpose: Uncertainty evaluation)"], "pages": [4, 6, 8, 12, 13]}]</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('qaData').textContent),$=id=>document.getElementById(id),synth=window.speechSynthesis;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
function stop(){if(synth)synth.cancel();$('status').textContent='';}
function speak(text){if(!synth){$('status').textContent=' このブラウザは読み上げ非対応です。';return;}stop();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;const v=synth.getVoices().find(v=>/^en[-_]/i.test(v.lang));if(v)u.voice=v;u.onerror=()=>{$('status').textContent=' 音声を再生できませんでした。';};synth.speak(u);}
const categories=[...new Set(DATA.map(q=>q.category))];categories.forEach(c=>$('category').add(new Option(c,c)));
const nodes=[];
for(const [i,q] of DATA.entries()){
 const d=el('details');d.id=q.id;const s=el('summary',`${i+1}. ${q.question}`);s.append(el('small',`${q.category} / ${q.priority==='A'?'先に準備':'詳細を聞かれたら'}`));d.append(s);
 const content=el('div',undefined,'content');content.append(el('p','英語での質問例','label'),el('p',q.question_en,'question-en'));
 const question=el('button','質問を聞く','listen');question.onclick=()=>speak(q.question_en);question.disabled=!synth;content.append(question);
 content.append(el('p','短い英語回答','label'),el('p',q.answer_en,'answer-en'));const answer=el('button','英語回答を聞く','listen');answer.onclick=()=>speak(q.answer_en);answer.disabled=!synth;content.append(answer,el('p',q.answer_ja,'answer-ja'));
 const explanation=el('div',undefined,'explanation');q.details.forEach(p=>explanation.append(el('p',p)));content.append(explanation);if(q.formula)content.append(el('pre',q.formula));
 const sources=el('div',undefined,'sources');sources.append(el('p','根拠: '+q.sources.join(' / ')));q.pages.forEach(p=>{const a=el('a',`原稿${p}ページ`);a.href='index.html?page='+p;sources.append(a);});content.append(sources);d.append(content);$('list').append(d);nodes.push({q,d});
}
function filter(){const query=$('search').value.trim().toLowerCase(),category=$('category').value,priority=$('priority').value;let count=0;for(const {q,d} of nodes){const match=(!category||q.category===category)&&(!priority||q.priority===priority)&&(!query||JSON.stringify(q).toLowerCase().includes(query));d.hidden=!match;if(match)count++;}$('count').textContent=`${count} / ${DATA.length}問`;}
$('search').oninput=filter;$('category').onchange=filter;$('priority').onchange=filter;$('stop').onclick=stop;
$('expand').onclick=()=>{const visible=nodes.filter(n=>!n.d.hidden);const open=visible.some(n=>!n.d.open);visible.forEach(n=>n.d.open=open);$('expand').textContent=open?'表示中をすべて閉じる':'表示中をすべて開く';};
const hash=location.hash.slice(1);if(hash){const item=nodes.find(n=>n.q.id===hash);if(item){item.d.open=true;item.d.scrollIntoView();}}
window.addEventListener('pagehide',stop);filter();
</script></html>

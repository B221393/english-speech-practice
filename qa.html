<script id="qaData" type="application/json">[{"id": "q01", "category": "目的・比較", "priority": "A", "pages": [2, 4, 14], "question": "何を測る研究で、今回どこまでできたのか？", "question_en": "What do you measure, and what have you achieved so far?", "answer_en": "My goal is to measure relative displacement between the spindle and the worktable from images. This presentation reports the measurement system, algorithms, and analysis of saved images.", "answer_ja": "主軸とテーブルの相対変位を画像から求めることが目的で、今回は装置・計算方法・保存画像の解析結果を示しています。", "details": ["求めたい量は機械座標系の相対変位ΔX・ΔY・ΔZです。カメラが直接出力するのは画像と画像座標の変化なので、画素から長さへの換算と座標軸の対応が必要です。", "今回の結果は、指令移動で取得した保存画像を用いた解析です。熱による実変形を運転中に連続測定し、独立基準で検証した段階とは区別して説明します。", "準備したもの、保存画像から計算できたもの、次に検証するものの順に答えると、現在の到達点が伝わります。"], "sources": ["発表2・4・14ページ"]}, {"id": "q02", "category": "目的・比較", "priority": "A", "pages": [3, 5], "question": "タッチプローブや変位センサがあるのに、なぜカメラを使うのか？", "question_en": "Why use a camera instead of a touch probe or a displacement sensor?", "answer_en": "A camera provides noncontact observation and records a target pattern for later analysis. I am evaluating whether this approach can measure the required displacement under the intended conditions.", "answer_ja": "非接触で模様を記録し、後から解析できることに着目しています。既存の測定器より優れていると断定する段階ではありません。", "details": ["タッチプローブは接触時の位置を、変位センサはそのセンサの測定原理に基づく変位を得ます。カメラ方式では画像から変位を計算するため、特徴や誤差要因が異なります。", "カメラ本体の価格だけで比較せず、レンズ、照明、取付・調整機構、PC、校正に要する費用も比較対象に含めます。", "価格、測定範囲、繰返し性、熱安定性、取付条件を同じ目的に対して比較する必要があります。スライドの価格と繰返し性の数字だけで方式全体の優劣は決めません。"], "sources": ["発表3・5ページ"]}, {"id": "q03", "category": "目的・比較", "priority": "A", "pages": [3, 4, 14], "question": "先行研究でも3次元熱変位を測っている。今回の独自性は何か？", "question_en": "How does your work differ from the previous study?", "answer_en": "The prior study measured thermal drift under changing machine temperatures and validated it against capacitive sensors. My current work implements and evaluates image measurement in our setup: XY uses FFT-based shifts from saved image pairs, and Z uses alignment of two focus-response curves. Thermal-drift validation against an independent reference is future work.", "answer_ja": "先行研究では、温度状態を変えた工作機械の3次元熱ドリフトを測定し、静電容量式変位センサと比較検証しています。今回は、自分たちの装置とソフトウェアによる保存画像の予備解析で、XYはFFT法の画素差を指令値と比較し、Zは2走査の曲線ずれを換算した段階です。原理全体を新規提案したことや、先行研究より高精度なことは実証していません。", "details": ["共通点：ドット格子、回転中心の推定、Z走査の合焦評価と曲線照合。", "XYの違い：論文2.1節は熱状態ごとの回転中心の変化。今回のXY結果は2画像のFFT法による並進量。回転中心を求めた表示例とXYの12結果も分ける。", "論文はテーブル上の4ターゲットから熱誤差モデルを同定し、各ターゲットに3方向の静電容量式センサを配置。今回のA/Bは校正用・変位測定用という役割分担であり、4地点のモデルを再現した意味ではない。", "今回の寄与は現装置での実装・計算・評価の段階として説明する。一般的な格子端点除外そのものの新規性や優位性は主張しない。"], "sources": ["20261023_全校正の端点方式統一/results/summary.json", "active GUI functions/s0_grid.py", "Vogl et al. (2023), sections 2–5; DOI 10.1016/j.cirp.2023.04.053"]}, {"id": "q04", "category": "目的・比較", "priority": "B", "pages": [5, 6, 7, 9], "question": "Target AとTarget Bを分けているのはなぜか？", "question_en": "Why do you use two targets?", "answer_en": "Target A is used for pixel-scale and rotation-center calibration. Target B is used for in-plane XY and out-of-plane Z displacement measurement.", "answer_ja": "校正用のAと、変位測定用のBで役割を分けています。", "details": ["Target Aでは既知のドット間隔と回転時のドット軌跡を利用します。前者は画素倍率、後者は画像上の回転中心を求める情報になります。", "Target Bでは画像間の模様のずれをXY変位に、ピントに応じた画像指標の変化をZ変位に結びつけます。", "ターゲットを変更したときも同じ倍率や取付条件をそのまま使えるとは限りません。撮影倍率、距離、光軸、取付の再現性を確認する項目として説明します。"], "sources": ["発表5〜9ページ"]}, {"id": "q05", "category": "校正・格子", "priority": "A", "pages": [6, 12], "question": "200µmという既知間隔は真値なのか？", "question_en": "Is the 200-micrometer target pitch an independently verified reference?", "answer_en": "I use 200 micrometers as the known target pitch in this calculation. Its manufacturing tolerance and traceability must be included when evaluating the uncertainty of the scale.", "answer_ja": "計算上の既知間隔として200µmを使っていますが、その値の公差や校正証明まで確認できたと同一視しないことが重要です。", "details": ["倍率は既知間隔を画素間隔で割って求めるため、既知間隔の誤差は倍率に直接影響します。基準長の不確かさをゼロと仮定したまま実位置精度を主張できません。", "説明時は、設計値・仕様値・独立測定値のどれに基づく200µmなのかを資料で確認して答えます。この発表データだけから校正証明の有無は断定しません。", "今後の確認資料はターゲットの仕様、製作公差、基準測定の記録です。これらが未確認なら、未確認の項目として具体的に示します。"], "sources": ["発表6・12ページ", "校正_発表用9件.csv"]}, {"id": "q06", "category": "校正・格子", "priority": "A", "pages": [6, 12], "question": "代表画像0.856573と9件平均0.856738はどう求め、どちらを使うのか？", "question_en": "How did you calculate the pixel scale?", "answer_en": "With nominal spacing s = 200 micrometers and fitted spacing d in pixels, the pixel scale is ell = s / d. Record ten gives 0.856573 micrometers per pixel; the first-nine mean is 0.856738 and is used for the XY results.", "answer_ja": "sを公称中心間隔200 µm、dを回転格子へのフィットで求めた画素間隔とすると、画素倍率l=s/dです。代表10件目は0.856573 µm/px、全15画像に同じ処理を行った先頭9件の平均は0.856738 µm/pxです。XY換算には後者を使います。", "details": ["代表画像と平均の対象画像は異なる。15画像すべてを同じ閾値110・円形度0.55・外周候補0.52・行列端点方式で処理した。", "35点は代表画像の倍率フィットの点数、55本は採用点の隣接接続、9件は平均する校正画像数。"], "formula": "l = s / d\ns = 200 µm\nRepresentative d = 233.488581941 px\nRepresentative l = 0.856572935332 µm/px\nMean l (1–9) = 0.856738280849663 µm/px", "sources": ["20261023_全校正の端点方式統一/results/summary.json", "active GUI functions/s0_grid.py"]}, {"id": "q07", "category": "校正・格子", "priority": "A", "pages": [6], "question": "隣接点は具体的にどう選ぶのか？", "question_en": "How do you select neighboring dots?", "answer_en": "After endpoint selection, retained dots are linked when one common grid index differs by one and the other is unchanged. Diagonal and missing-cell-spanning links are excluded.", "answer_ja": "端点除外後の採用点について、共通格子番号の一方だけが1違い、もう一方が同じ点を結びます。対角や欠け点を飛び越す接続は作りません。", "details": ["55本のリンクは格子構造の表示であり、55回の独立した測定ではない。", "0.8p〜1.3pは現行処理の初期方向推定に使う距離範囲。最終リンクの独立した追加条件とは区別する。"], "formula": "(|Δrow|, |Δcol|) = (1,0) or (0,1)\n0.8 p ≤ distance ≤ 1.3 p\nmaximum degree = 4", "sources": ["20261023_全校正の端点方式統一/results/summary.json", "active GUI functions/s0_grid.py"]}, {"id": "q08", "category": "校正・格子", "priority": "B", "pages": [6], "question": "斜めの点や、欠けた点の先をつながないのはなぜか？", "question_en": "Why do you exclude diagonal links and links across missing dots?", "answer_en": "The reference distance is one horizontal or vertical grid pitch. Diagonal links and links across a missing cell represent different distances and are excluded.", "answer_ja": "200µmに対応する上下左右1格子分の距離を使うためです。", "details": ["正方格子の斜め1セルは約√2p、1点抜けた先は約2pです。これを1ピッチとして200µmで割ると倍率を誤ります。", "格子セル差の条件により斜めや欠測の飛び越しを除外し、距離条件も併用します。上限1.3pは理想格子の斜め距離√2pより小さい値です。", "欠けた格子点は補間して作りません。欠測は欠測のまま扱い、実際に検出した点と有効な接続だけで計算します。"], "sources": ["仕様補足20・21ページ", "func_pixel_scale.py:499–534"]}, {"id": "q09", "category": "校正・格子", "priority": "B", "pages": [6], "question": "同じドットを複数検出した場合はどう除くのか？", "question_en": "How do you reject duplicate dot centers?", "answer_en": "If candidates map to the same cell, a regular dot is preferred over a weak edge candidate; otherwise the smaller grid residual is preferred.", "answer_ja": "同じ共通格子セルに複数の候補が入った場合は、円形度が通常条件を満たす点を弱い外周候補より優先し、同条件なら格子への残差が小さい点を残します。", "details": ["実測候補のどちらを残すかを決める処理。欠けた位置に点を作る処理ではない。"], "sources": ["20261023_全校正の端点方式統一/results/summary.json", "active GUI functions/s0_grid.py"]}, {"id": "q10", "category": "校正・格子", "priority": "A", "pages": [6], "question": "閾値110と従来APIの既定値160はどう区別しているか？", "question_en": "Why is the processing threshold 110 while the default is 160?", "answer_en": "All fifteen processed images and the new GUI grid mode use threshold 110. A legacy core API still defaults to 160; that value is not used for these results.", "answer_ja": "今回の全15画像と新しいGUIの格子方式は閾値110です。160は従来方式のコアAPIに残る既定値で、今回の再計算には使っていません。", "details": ["旧方式の再現と今回の新方式を区別し、結果JSONに保存した条件を確認する。"], "sources": ["20261023_全校正の端点方式統一/results/summary.json", "active GUI functions/s0_grid.py"]}, {"id": "q11", "category": "校正・格子", "priority": "B", "pages": [6], "question": "面積・円形度の条件と重心の計算式は？", "question_en": "What are the contour-selection and centroid conditions?", "answer_en": "Contours are filtered by area and circularity. Their centers are calculated from image moments, with circularity required to be at least 0.55.", "answer_ja": "面積範囲と円形度を満たした輪郭について、画像モーメントから中心を求めます。", "details": ["現行コードの既定最小面積は500px²、最大面積は10000px²です。画像サイズ適応が有効な経路では、実効最小面積を下式で決めます。固定の500と実効値を混同しません。", "円形度は4πA/P²で計算し、0.55未満は除外します。Aは輪郭面積、Pは周長です。面積や周長が退化した輪郭も除外します。", "中心はx=m10/m00、y=m01/m00です。表示用の円の大きさと、実際に測った輪郭半径・面積は別の量です。"], "formula": "Amin = min(500, max(50, 0.0002 W H)) px²\nAmin ≤ A ≤ 10000 px²\n4πA/P² ≥ 0.55\nx = m10/m00, y = m01/m00", "sources": ["仕様補足19ページ", "func_pixel_scale.py:140–180"]}, {"id": "q12", "category": "校正・格子", "priority": "B", "pages": [6, 7], "question": "校正の行列端点除外と、回転動画の180 px余白は同じ条件か？", "question_en": "Are the 12-percent exclusion and the 180-pixel margin the same condition?", "answer_en": "They are separate rules. Calibration removes the endpoints of each original row and column once. The rotation example uses tracks observed in all 486 frames and inside a fixed 180-pixel image margin. The old twelve-percent trim is not used for the current calibration results.", "answer_ja": "別条件です。S0校正は元の各行・各列の両端1点ずつを1回除外します。S1回転例は、全486フレームを通して追跡でき、軌跡全体が固定180 pxの画像余白内に残った点を使います。外周12%は今回の校正結果には使っていません。", "details": ["S0代表画像：候補60、採用35、除外25、接続55。", "S1代表動画：486フレームにわたる14軌跡。校正の35点と同じ集合ではない。"], "sources": ["20261023_全校正の端点方式統一/results/summary.json", "active GUI functions/s0_grid.py"]}, {"id": "q13", "category": "校正・格子", "priority": "B", "pages": [6, 12], "question": "格子が回転していても倍率を求められるのはなぜか？", "question_en": "How do you account for a rotated grid?", "answer_en": "Neighbor directions estimate the lattice orientation. Common row and column indices and the measured centers are then fitted to a square grid with rotation.", "answer_ja": "近い点同士の方向から格子の傾きを推定し、その向きで共通行・列番号を付けます。その番号と実測した中心座標を、回転を含む正方格子モデルへ当てはめます。", "details": ["任意の9×9配列などへ強制していない。欠測セルは空ける。", "残差による確認は行うが、透視変形やレンズ歪みをすべて補正したことは意味しない。"], "formula": "zᵢ ≈ z₀ + a(cᵢ + i rᵢ)\np = |a|, s = 200 / p", "sources": ["20261023_全校正の端点方式統一/results/summary.json", "active GUI functions/s0_grid.py"]}, {"id": "q14", "category": "校正・格子", "priority": "A", "pages": [6, 12], "question": "なぜ9件平均なのか。ばらつきが小さければ高精度と言えるか？", "question_en": "Why use nine records, and does the small spread prove accuracy?", "answer_en": "I kept the first-nine group already used in the presentation and processed all fifteen images consistently. The mean is 0.856738 micrometers per pixel. A small spread alone does not establish accuracy or fixed-condition repeatability.", "answer_ja": "従来の発表で定めた先頭9件の集計対象を維持し、その9画像も含む全15画像を同じ方法で再計算しました。平均値は0.856738 µm/pxです。ばらつきが小さいだけでは、独立基準に対する精度や、同一条件の繰返し精度を証明できません。", "details": ["平均対象を今回の結果が良くなるように選び直したわけではない。", "15枚全体の平均は0.856938 µm/px。撮影条件が同一の独立反復とは確認できていないため、9件平均と混ぜない。"], "sources": ["20261023_全校正の端点方式統一/results/summary.json", "active GUI functions/s0_grid.py"]}, {"id": "q15", "category": "回転・XY", "priority": "B", "pages": [7], "question": "回転中心は何のために求め、何を確認したのか？", "question_en": "Why estimate the rotation center, and what did you verify?", "answer_en": "The example is one rotation sequence. Fourteen dots tracked through all 486 frames and within a 180-pixel image margin provide a common rotation center. Its accuracy against an independent reference has not been established.", "answer_ja": "表示例は1本の回転動画です。全486フレームで追跡され、軌跡全体が画像端から180 pxの内側に残った14点から共通中心を求めています。中心精度を独立基準で検証した結果ではありません。", "details": ["14点は動画内の追跡点数。14回の実験ではない。", "論文2.1節でも完全に写った点を使い周辺の部分点を避けているが、今回の固定180 pxという数値を論文から採用したとは言わない。"], "sources": ["20261023_全校正の端点方式統一/results/summary.json", "active GUI functions/s0_grid.py"]}, {"id": "q16", "category": "回転・XY", "priority": "B", "pages": [7], "question": "ドットはどう対応付けるのか。35pxと30フレームの意味は？", "question_en": "How are dots matched between frames?", "answer_en": "Each track is matched to the nearest unused center less than 35 pixels away. Tracks with at least thirty points satisfy the minimum-length condition; the displayed example uses full-length tracks.", "answer_ja": "未使用の検出点のうち35px未満で最も近い点へ対応付け、最低30フレームを有効条件にしています。", "details": ["35pxはフレーム間の中心移動距離の上限です。実装は厳密な小なり比較なので、35pxちょうどを含む『35px以下』とは言いません。", "一般の有効長は30フレーム以上ですが、今回の説明図では全486フレームを通して追跡できる点を選んでいます。", "最近傍対応は大移動、欠測、点の接近で取り違えが起こり得ます。この条件だけで、全速度・全照明下の追跡精度が保証されるわけではありません。"], "sources": ["発表7ページ／仕様補足23ページ", "func_rotate.py:73–132"]}, {"id": "q17", "category": "回転・XY", "priority": "A", "pages": [8], "question": "FFT-methodでは、実際には何を計算しているのか？", "question_en": "What does the FFT method actually calculate?", "answer_en": "I calculate the Fourier transforms, normalize the cross-power spectrum, and find the peak of the inverse transform. The peak location gives the image shift.", "answer_ja": "FFT、相互パワースペクトルの正規化、逆FFT、ピーク位置の探索で画像間の移動を求めます。", "details": ["スライドのFFT-methodは広い呼び方です。質問された場合は、正規化した相互パワースペクトルを用いる位相限定相関の処理だと具体的に説明します。", "実装はconj(F1)F2を用い、振幅で正規化した後、実部の逆FFTで相関面を求めます。ゼロ付近の除算を避けるepsilonは10⁻¹²です。", "画像サイズの一致が必要で、循環相関の折返し、周期模様による複数ピーク、低コントラストには注意します。コードにサブピクセル補間があることと、今回の整数値の記録でその性能を実証したことは別です。"], "formula": "F₁ = FFT2(I₁), F₂ = FFT2(I₂)\nC = conj(F₁)F₂\nR = C / (|C| + ε) if |C| > ε; otherwise 0\nε = 10⁻¹²\nc = Re[IFFT2(R)]\n(Δu, Δv) = peak position of c", "sources": ["発表8ページ／仕様補足23ページ", "func_xy.py:102–153"]}, {"id": "q18", "category": "回転・XY", "priority": "A", "pages": [8, 13], "question": "X方向100µmなのに、画像では−108pxと＋44pxになるのはなぜか？", "question_en": "Why do both image coordinates change for an X-axis command?", "answer_en": "The camera axes can be rotated relative to the machine axes. I use the pixel-shift magnitude for the reported displacement length; machine-axis components require a separate coordinate mapping.", "answer_ja": "画像軸と機械軸の向きが異なるためで、今回の長さ換算は2成分のノルムを使っています。", "details": ["画像の横変位だけを機械X変位と同一視できません。単一の倍率と平面内回転を仮定すれば、画像変位の長さは√(Δu²+Δv²)で求められます。", "この例は√(108²+44²)≒116.619pxで、平均倍率を掛けると約99.90µmです。符号付きの画像成分と、正の変位長を区別して答えます。", "各機械軸の符号付き成分を求める場合は、既知の機械移動と画像移動から座標変換を確認します。1つの倍率だけで傾き・レンズ歪み・異方性まで解決したとは言いません。"], "formula": "L = s√(Δu²+Δv²)\n= 0.8566656508 × √(108²+44²)\n≈ 99.90 µm", "sources": ["発表8・13ページ", "13ページ_指令値と測定値.csv"]}, {"id": "q19", "category": "回転・XY", "priority": "A", "pages": [11, 13], "question": "今回、実験を何回行ったのか？ 画像枚数・点数とはどう違うか？", "question_en": "Are these twelve repeated measurements under one condition?", "answer_en": "The material contains fifteen calibration images, twelve XY measurements (eight X and four Y), two Z scans producing one result, and one illustrated rotation sequence. These are different units and cannot be added into a total experiment count. The XY cases are not twelve fixed-condition repeats.", "answer_ja": "今回の資料で確認できるのは校正15画像（平均対象9画像）、XY変位12件（X8件・Y4件）、Z走査2本から1結果、回転例1動画です。これらを足して実験総数とすることはできません。XY12件も同じ条件での12回反復ではありません。", "details": ["実験日数・独立した設置回数・熱実験の総数は、この資料だけからは確定しない。", "今回行ったのは既存画像の処理であり、新たな実機試験は0回。"], "sources": ["20261023_全校正の端点方式統一/results/summary.json", "active GUI functions/s0_grid.py"]}, {"id": "q20", "category": "回転・XY", "priority": "A", "pages": [13, 14], "question": "RMSE 0.41µm、最大差0.78µmなら、1µm精度を証明したのか？", "question_en": "Do these errors prove sub-micrometer positioning accuracy?", "answer_en": "These values are differences from commanded displacement after converting saved pixel shifts. They do not by themselves establish accuracy against an independent position reference.", "answer_ja": "保存画素差を換算した値と指令値との差であり、独立した実位置基準に対する精度の証明ではありません。", "details": ["各記録でe=L−Cを計算しています。Cは指令変位、Lは同じ画素差に平均倍率を掛けた長さです。指令値そのものを誤差ゼロの実移動量とは仮定できません。", "現在の12件CSVを再計算するとRMSEは約0.40818µm、最大絶対差は約0.78271µmです。スライドでは0.41µm・0.78µmに丸めています。", "百分率は100(L−C)/Cで、今回の範囲は約−0.52〜＋0.59%です。独立基準との同時比較と条件固定の反復試験を次に用意します。"], "formula": "eᵢ = Lᵢ − Cᵢ\nRMSE = √mean(eᵢ²)\ne% = 100(L−C)/C", "sources": ["発表13・14ページ", "13ページ_指令値と測定値.csv"]}, {"id": "q21", "category": "回転・XY", "priority": "B", "pages": [11, 13], "question": "旧倍率0.869733と平均倍率0.856738で結果が変わる理由は？", "question_en": "Why does changing the pixel scale change the displacement result?", "answer_en": "The same saved pixel-shift length is multiplied by a different scale. This changes the converted displacement proportionally; it is not a new image measurement.", "answer_ja": "同じ画素差に掛ける倍率が違うためで、新しい撮影や画素差の再測定を行ったことにはなりません。", "details": ["L=spなので、画素変位長pが同じなら倍率sの差が長さLへ比例して反映されます。2つの倍率の差はおよそ1.5%です。", "倍率を変更して指令値との差が小さくなったことだけで、新しい倍率が正しいと結論づけないようにします。指令値への一致と基準長の妥当性は別に確認します。", "比較では画素差、対象記録、誤差定義を揃えて、換算のどの要素を変更したのかを明示します。"], "sources": ["発表11・13ページ", "13ページ_指令値と測定値.csv"]}, {"id": "q22", "category": "Z・RMS", "priority": "A", "pages": [9], "question": "GDERとは何か。なぜピントの指標になるのか？", "question_en": "What is GDER, and why is it related to focus?", "answer_en": "GDER is the mean energy of Gaussian-derivative responses in the horizontal and vertical directions. It measures image sharpness and changes as the target moves through focus.", "answer_ja": "横・縦のGaussian微分応答のエネルギーを平均した、画像の鮮明さを表す指標です。", "details": ["現行の既定窓は15×15画素で、半径7からsigma=7/2.5=2.8画素を用います。横応答Gxと縦応答Gyの二乗和を画像上で平均します。", "輪郭が鮮明な画像では空間微分の応答が大きくなり、ピンぼけでなだらかになると指標が変化します。ただし、模様、照明、露光、ノイズにも影響されます。", "GDERの値を1つ見ただけでZ位置が一意に決まるとは限りません。今回の方法はZ走査に対する曲線どうしを比較して横ずれを求めます。"], "formula": "GDER = mean(Gx² + Gy²)\nwindow = 15×15 pixels, σ = 2.8 pixels", "sources": ["発表9ページ／仕様補足24ページ", "func_z.py:13–60"]}, {"id": "q23", "category": "Z・RMS", "priority": "A", "pages": [9, 10], "question": "GDERの最大位置だけでなく、曲線全体をRMSで比べる理由は？", "question_en": "Why align whole focus curves instead of comparing only their peaks?", "answer_en": "Curve alignment uses information from the overlapping part of both responses. I select the offset that minimizes their RMS difference, assuming the curve shapes remain comparable.", "answer_ja": "重なり区間の曲線形状を使って位置合わせし、RMS差が最小になるずれを選びます。", "details": ["最大値の位置だけを使うと、ピーク付近の平坦さや局所的なノイズの影響を受けます。曲線比較は複数のサンプルを利用する方法として説明できます。", "一方、2本の曲線形状が大きく変わると、最小RMSの位置を単純に高さ差と解釈できません。照明や姿勢の変化が形状に与える影響を確認する必要があります。", "この選択理由と、ピーク法より統計的に優れていると実証したことは分けます。方法比較を行っていなければ、その優劣まで主張しません。"], "sources": ["発表9・10ページ／仕様補足24ページ"]}, {"id": "q24", "category": "Z・RMS", "priority": "B", "pages": [10], "question": "正規化は最大値割りか、min–maxか？", "question_en": "Which normalization was used for the displayed RMS result?", "answer_en": "The displayed result divides each stored curve by its own maximum. The current helper function uses min–max normalization, which is a separate processing path.", "answer_ja": "発表の表示結果は各曲線の最大値で割る処理です。現行の補助関数のmin–max正規化とは区別します。", "details": ["表示結果の再計算はf/max(f)を使っています。これに対してmin–maxは(f−min(f))/(max(f)−min(f))で、最小値の扱いが異なります。", "最大値割りは振幅スケールの差を抑える処理ですが、最小値や背景の違いまで同じにする処理ではありません。", "質問された場合は、発表結果を作った処理経路と現在の関数を取り違えずに答えます。違う前処理の結果を同一条件の比較として混ぜません。"], "formula": "Displayed result: f / max(f)\nCurrent helper: (f − min(f)) / (max(f) − min(f))", "sources": ["仕様補足24ページ", "再指摘_20261020/prepare.py:47–57", "func_z.py:63–86"]}, {"id": "q25", "category": "Z・RMS", "priority": "B", "pages": [10], "question": "RMSの計算範囲と探索範囲は？ 重なりが減ってもよいのか？", "question_en": "What is the RMS search range, and how is overlap handled?", "answer_en": "The displayed sweep uses integer offsets from zero to 134 and evaluates RMS only on the overlap. The minimum is at 66 intervals, with 273 overlapping samples.", "answer_ja": "0〜134の整数ずれを探索し、その時点で重なる部分だけでRMSを計算しています。", "details": ["RMS(k)=√mean((f−g)²)を各ずれkの重なり区間で計算します。現在の最小値はk=66、RMS≒0.001944、重複サンプル数273です。", "ずれによって使う区間とサンプル数が変わるため、小さいRMSだけで全てのずれを同じ信頼度と見なせません。重複数と曲線の形状も確認します。", "今後は最小重複数、同じ支持区間での比較、近傍の極小との差などを確認項目にできます。現行結果で実施済みの処理と今後の評価案を区別します。"], "formula": "RMS(k) = √[Σ(fⱼ−gⱼ)² / N(k)]\nk = 0,…,134\nbest k = 66, N(66) = 273", "sources": ["発表10ページ／仕様補足24ページ", "Z_RMS_135点.json"]}, {"id": "q26", "category": "Z・RMS", "priority": "A", "pages": [10], "question": "66フレーム間隔が98.21µmになる計算を説明してほしい。", "question_en": "How do 66 frame intervals correspond to 98.21 micrometers?", "answer_en": "At the commanded feed of five millimeters per minute and the capture setting of 56 frames per second, one interval corresponds to about 1.488 micrometers. Sixty-six intervals give 98.21 micrometers.", "answer_ja": "指令送り速度を1フレーム間隔の長さへ換算し、66を掛けています。", "details": ["5mm/minをµm/sへ直すと5000÷60≒83.333µm/sです。これを56fpsで割ると約1.488095µm/間隔になります。", "66×1.488095≒98.214286µmなので、表示は98.21µmです。枚数とフレーム間隔数を混同しないようにします。", "これは指令送り速度と撮影設定を使った換算値です。実速度や画像時刻と位置の対応を独立に確認した値として説明しないことが重要です。"], "formula": "v = 5000 / 60 = 83.333… µm/s\nΔz = v / 56 = 1.488095… µm/interval\nZ = 66 Δz = 98.214285… µm", "sources": ["発表10ページ／仕様補足24ページ", "Z_RMS_135点.json"]}, {"id": "q27", "category": "Z・RMS", "priority": "A", "pages": [9, 10, 11], "question": "500枚・56fpsと500µm・5mm/minでは時間が合わないのでは？", "question_en": "Are the image count and the commanded scan duration consistent?", "answer_en": "Five hundred images span about 8.91 seconds at 56 frames per second, whereas a 500-micrometer move at five millimeters per minute takes six seconds. I need timestamps and motion records to identify the corresponding constant-speed interval.", "answer_ja": "設定値をそのまま同じ区間と見なすと時間差があります。撮影と移動の対応区間を記録で確認する必要があります。", "details": ["500枚の最初から最後までは499間隔なので、499÷56≒8.91秒です。500µmを5mm/minで送る指令上の所要時間は6秒です。", "撮影の前後に静止区間が含まれたのか、開始・停止のタイミングや設定の対応が異なるのかは、設定値だけでは特定できません。原因を推測で断定しません。", "画像タイムスタンプと実際の位置・速度記録を対応付け、定速区間を確認することが次の検証です。この差がある状態で、全フレームを実移動の等間隔サンプルと保証することはできません。"], "formula": "image span = (500−1)/56 ≈ 8.91 s\nnominal move time = 500/(5000/60) = 6.00 s", "sources": ["発表9〜11ページ", "保存枚数・撮影設定・送り指令からの再計算"]}, {"id": "q28", "category": "結果・検証", "priority": "A", "pages": [10, 11, 14], "question": "Zの−1.79%を誤差や精度と呼んでよいか？", "question_en": "What does the minus 1.79-percent Z difference mean?", "answer_en": "It is the difference between the converted 98.21-micrometer result and the 100-micrometer height setting. It is one result from one pair of scans, not an uncertainty estimate.", "answer_ja": "設定100µmと換算結果との差率であり、1組の走査から得た1結果です。", "details": ["差率は100×(98.214286−100)/100≒−1.79%です。比較基準が初期高さの設定値であることを明示します。", "1組の走査だけでは、繰返しばらつきや信頼区間は求められません。この差率を標準偏差や測定不確かさと呼ばないようにします。", "実位置基準との同時比較、複数回の反復、速度・撮影時刻の対応確認を用意し、系統的なずれとランダムな変動を分けます。"], "sources": ["発表10・11・14ページ", "Z_RMS_135点.json"]}, {"id": "q29", "category": "結果・検証", "priority": "A", "pages": [12, 13, 14], "question": "不確かさには何を含め、次に何と比較するのか？", "question_en": "What uncertainty sources and reference measurements will you evaluate?", "answer_en": "I will evaluate target-pitch uncertainty, image processing, mounting stability, and synchronization. I will also compare repeated measurements with an independent position reference under fixed conditions.", "answer_ja": "基準長・画像処理・取付・同期の影響を分け、条件を固定した反復と独立位置基準との比較を進めます。", "details": ["XYでは基準ピッチと倍率の不確かさ、中心や画素ずれの推定、レンズ歪み、取付方向、熱や振動の影響が候補です。L=spならsとpの影響を分けて考えます。", "Zでは焦点曲線の再現性、正規化と位置合わせ、照明・露光、実送り速度、撮影時刻と位置の同期が候補です。今回の数値だけで寄与率を決めません。", "比較用センサは必要な範囲・分解能・不確かさ・同期方法を確認して選びます。特定機器での比較が実施済みであるかのようには答えません。"], "sources": ["発表12〜14ページ"]}, {"id": "q30", "category": "結果・検証", "priority": "A", "pages": [14], "question": "次にどの実験を行えば、主張を強くできるのか？", "question_en": "Which experiments will you do next?", "answer_en": "I will repeat XY measurements under fixed conditions and test broad Z scans and fine Z steps. I will compare the results with a reference and check synchronization before measuring actual thermal deformation.", "answer_ja": "条件固定のXY反復、広いZ走査と細かいZステップ、基準比較と同期確認を順に準備します。", "details": ["XYは軸・移動方向・指令長・撮影条件を固定した繰返しで、条件内のばらつきと方向依存を評価します。複数条件を混ぜたRMSEとは別に示します。", "Zは広い範囲で曲線形状と位置合わせの成立範囲を確認し、細かいステップで識別性と再現性を調べます。最小RMSだけでなく重なりと極小の一意性も見ます。", "画像時刻と位置の対応を確認し、独立基準との比較を経て、検証した条件を実際の熱変形測定へ適用します。実施順序や条件は指導教員と結果を見て詰めます。"], "sources": ["発表14ページ"]}, {"id": "q31", "category": "結果・検証", "priority": "B", "pages": [6, 7, 8, 10], "question": "どのような場合に結果を採用しないのか？", "question_en": "When would you reject a measurement result?", "answer_en": "I would reject or review results with insufficient dots, inconsistent grid geometry, unreliable image correlation, or an ambiguous curve-alignment minimum. A computed number alone is not sufficient for acceptance.", "answer_ja": "点・格子・相関・曲線位置合わせの成立条件を確認し、数字が出ただけでは採用しません。", "details": ["格子では10点未満、姿勢の整合性不足、必要な行・列・辺の不足などを確認します。点を増やすために欠測を埋めたり、しきい値をその場で勝手に緩めたりしません。", "FFTでは相関ピーク低下や循環折返しの警告を確認します。焦点曲線では形状変化、重複不足、複数の同程度の極小がある場合を調べます。", "既存コードの判定、保存結果で確認できる事実、これから追加する採否基準を区別します。全ての判定が今回のデータで実運用済みだったとは言いません。"], "sources": ["仕様補足20〜24ページ", "func_pixel_scale.py／func_xy.py"]}, {"id": "q32", "category": "結果・検証", "priority": "B", "pages": [14], "question": "未確認の質問を受けたとき、どう答えるか？", "question_en": "How will you answer a question that you have not evaluated yet?", "answer_en": "I have not evaluated that point yet. I can explain the current calculation, and I will check the required data before making a conclusion.", "answer_ja": "分かっている計算内容と、まだ確認していない事実を分けて答えます。", "details": ["まず何が未確認なのかを具体的に答えます。例として、基準ピッチの校正証明、実速度、画像と位置の同期、条件固定の繰返し回数などがあります。", "続いて、現時点で示せる式・設定・保存結果を説明します。質問の答えにならない一般論や、確かめていない原因の断定で埋めないようにします。", "最後に、どの記録や実験で確認するかを述べます。質問の意図が不明な場合は、Could you clarify which condition you mean? と対象条件を確認できます。"], "sources": ["発表14ページ／質疑応答の準備"]}, {"id": "q33", "category": "校正・格子", "priority": "A", "question": "0.856738や99.91という表示桁は、どこまで物理的に有意か？", "question_en": "Why is the pixel scale given to six digits (0.856738 µm/px)? Is six-digit precision physically justified?", "answer_en": "Six decimal places in the scale and two in the length are computational display choices, not guaranteed physical precision. I retain full precision internally and round the output. Physically justified digits require uncertainty evaluation.", "answer_ja": "倍率の小数6桁や長さの小数2桁は、計算と表示の桁です。保証された物理精度ではありません。内部では丸めず計算し、表示時に丸めます。何桁まで物理的に有意かは、ターゲット間隔の不確かさ、点検出、倍率の変動、同期や独立基準などの評価後に決めます。", "details": ["画素差が整数で保存されていることと、数値の有効数字を単純に同一視しない。格子モデルの倍率は多数点の連続座標から求められる。", "200 µmは公称間隔であり、無限精度の真値とは扱わない。", "根拠なしに「物理精度は3〜4桁」とも断定しない。"], "formula": "L = l × sqrt(Δu² + Δv²)\nKeep full precision internally; round for display.\nDisplayed digits ≠ established uncertainty.", "sources": ["20261023_全校正の端点方式統一/results/summary.json", "active GUI functions/s0_grid.py"], "pages": [4, 6, 8, 12, 13]}, {"id": "q34", "category": "目的・比較", "priority": "A", "question": "タッチプローブや変位センサがあるのに、なぜカメラを使うのか？", "question_en": "Why do you use a camera instead of touch probes or displacement sensors?", "answer_en": "A camera observes the pattern without contact and supports displacement estimation from images. This work does not establish lower total system cost or better accuracy than dedicated sensors. XY images and Z scans are separate acquisitions.", "answer_ja": "カメラは模様を非接触で観察でき、画像から変位を求められます。ただし、専用センサより装置全体が安いことや、高精度であることを今回比較実証したわけではありません。XY用画像とZ走査のデータは別に取得します。", "details": ["カメラ本体の製品例と、今回の装置全体の費用を混同しない。", "1枚の画像からXYZを同時に直接測定したという説明はしない。"], "formula": "XY: image-shift analysis\nZ: focus-response curve alignment\nSeparate acquisitions and validation requirements", "sources": ["20261023_全校正の端点方式統一/results/summary.json", "active GUI functions/s0_grid.py"], "pages": [3, 4, 5]}, {"id": "q35", "category": "校正・格子", "priority": "A", "question": "なぜ実験のたびに毎回ターゲットAで校正撮影を行うのか？倍率を固定値にしては駄目なのか？", "question_en": "Why do you calibrate with Target A before each experiment instead of using a fixed pixel scale?", "answer_en": "Camera-to-target geometry can affect the image spacing, so calibration should be checked for the measurement setup. The saved records do not establish that calibration was performed immediately before every measurement.", "answer_ja": "カメラとターゲットの距離や姿勢が変わると画像上の間隔が変わり得るため、その条件での校正を確認する必要があります。ただし、今回の保存記録だけで「全測定直前に毎回校正した」とは確認できません。", "details": ["実施履歴と、今後採用する手順を区別する。", "今回のXYは先頭9校正画像の暫定平均で同じ保存画素差を換算したもの。"], "formula": "Pixel scale sensitivity:\ns = L / d  (L = 200 µm fixed pitch, d = pixel spacing)\nTilt angle θ and working distance change d directly, requiring in-situ calibration per run.", "sources": ["20261023_全校正の端点方式統一/results/summary.json", "active GUI functions/s0_grid.py"], "pages": [5, 6, 12]}, {"id": "q36", "category": "校正・格子", "priority": "A", "question": "各行・各列の端を1点ずつ除くとは、具体的に何をするのか？", "question_en": "Why do you exclude 12% of edge dots in Step 1? How does the lattice matrix structuring and border exclusion work?", "answer_en": "After estimating grid orientation, I assign common row and column indices. I exclude the union of the minimum and maximum column in every original row and the minimum and maximum row in every original column, once. The example retains 35 of 60 candidates and displays 55 links.", "answer_ja": "格子の傾きを補正して各実測候補に共通行・列番号を付けます。元の各行の最小列・最大列と、各列の最小行・最大行にある点を選び、その和集合を1回だけ除外します。代表例では60候補から25点を除いて35点をフィットし、55本の隣接線を示します。", "details": ["全体の1行目・最終行・1列目・最終列だけを消す規則ではない。短い行や列にも、その行・列の両端がある。", "除外後に端を取り直さない。内側が欠けていても、その隣を追加で除かない。", "外周が欠けて候補から落ちた場合、内側の点を端と誤認する可能性がある。0.52以上0.55未満の整合する候補は端の判定に使うが、倍率フィットには入れない。", "35点が最良・歪みがない・高精度と証明されたとは言わない。"], "formula": "Excluded = union(original row endpoints, original column endpoints)\nOne pass; no recursive peeling; no invented dots.\n60 candidates = 35 fitted + 25 excluded; 55 links.", "sources": ["20261023_全校正の端点方式統一/results/summary.json", "active GUI functions/s0_grid.py"], "pages": [6, 12, 19, 20]}, {"id": "q37", "category": "画像処理・アルゴリズム", "priority": "B", "question": "カメラノイズ（ホットピクセルや白黒ノイズ）はどうやって防いでいるのか？", "question_en": "How do you handle camera noise such as hot pixels or salt-and-pepper noise?", "answer_en": "Gaussian smoothing, thresholding, closing, contour area, circularity and lattice consistency reduce false detections. They do not guarantee removal of every noise feature or scratch.", "answer_ja": "9×9のガウシアン平滑化、二値化、7×7の閉処理の後、面積と円形度、格子への整合性で候補を選びます。これらは誤検出を抑える条件であり、すべてのノイズや傷を完全に除去した保証ではありません。", "details": ["中央値フィルタではなくガウシアン平滑化。", "円形度0.55以上が倍率フィット対象。外周候補は0.52以上。面積下限は画像サイズに応じる。"], "formula": "Gaussian blur: 9×9; closing: 7×7 ellipse\nAmin = min(500, max(50, 0.0002WH))\nRegular circularity >= 0.55; edge candidates >= 0.52", "sources": ["20261023_全校正の端点方式統一/results/summary.json", "active GUI functions/s0_grid.py"], "pages": [6, 19]}, {"id": "q38", "category": "XY変位・結果", "priority": "A", "question": "機械指令値（100µm）が完全に正しいと仮定した場合、画素ずれから逆算した倍率は幾らになるか？", "question_en": "If the machine command (100 µm) is assumed to be exact, what is the nominal pixel scale back-calculated from the image shifts?", "answer_en": "Assuming the 100-micrometer command is exact gives a nominal scale of 0.857492926 micrometers per pixel. The calibrated mean gives 99.911994 micrometers. Agreement with a command is not independent validation of actual position.", "answer_ja": "指令100 µmを正しいと仮定すると、逆算倍率は0.857492926 µm/pxです。今回の校正平均0.856738281を使うと99.911994 µmになります。指令値が独立した実位置基準だと証明されたわけではありません。", "details": ["逆算した倍率をその指令値へ合うよう校正に使い直してはいない。"], "formula": "Pixel length = 116.619037896906 px\nNominal command-derived scale = 0.857492925713 µm/px\nCalibration mean = 0.856738280849663 µm/px\nLength = 99.911994042137 µm", "sources": ["20261023_全校正の端点方式統一/results/summary.json", "active GUI functions/s0_grid.py"], "pages": [8, 13, 18]}, {"id": "q39", "category": "XY変位・結果", "priority": "A", "question": "発表で使われたXY 12測定の「指令値・各ピクセルずれ・測定値・指令差・逆算倍率」の一覧表は？", "question_en": "What are the exact pixel shifts, measured values, command differences, and nominal scales for all 12 XY measurements?", "answer_en": "The eight X commands span 100 to 150 micrometers; the four Y commands span 100 to 160. Reusing the saved pixel shifts with the new first-nine mean gives differences from -0.51% to +0.60%, maximum absolute difference 0.775423 micrometers and RMSE 0.408782 micrometers.", "answer_ja": "X8件は100〜150 µm、Y4件は100〜160 µmの指令です。同じ保存画素差を9件平均0.856738 µm/pxで換算し直すと、指令差は−0.51〜＋0.60%、最大絶対差0.775423 µm、RMSE 0.408782 µmです。", "details": ["これは12件の再換算であり、新しい12回の実験ではない。", "元記録番号との対応と原結果JSONのハッシュをCSVに保持。"], "formula": "ID | command µm | Δu px | Δv px | L µm | difference µm | difference %\nX1 | 100 | -108 | 44 | 99.911994 | -0.088006 | -0.088006\nX2 | 100 | -108 | 44 | 99.911994 | -0.088006 | -0.088006\nX3 | 100 | -108 | 44 | 99.911994 | -0.088006 | -0.088006\nX4 | 100 | 108 | -44 | 99.911994 | -0.088006 | -0.088006\nX5 | 100 | -108 | 44 | 99.911994 | -0.088006 | -0.088006\nX6 | 130 | -142 | 56 | 130.775423 | +0.775423 | +0.596479\nX7 | 140 | 152 | -62 | 140.640837 | +0.640837 | +0.457741\nX8 | 150 | -162 | 64 | 149.229939 | -0.770061 | -0.513374\nY1 | 100 | 44 | 108 | 99.911994 | -0.088006 | -0.088006\nY2 | 150 | 66 | 162 | 149.867991 | -0.132009 | -0.088006\nY3 | 150 | -68 | -162 | 150.522845 | +0.522845 | +0.348563\nY4 | 160 | -72 | -172 | 159.748955 | -0.251045 | -0.156903", "sources": ["20261023_全校正の端点方式統一/results/summary.json", "active GUI functions/s0_grid.py"], "pages": [8, 11, 13, 18]}, {"id": "q40", "category": "校正・格子", "priority": "A", "pages": [6, 19, 20], "question": "写真番号と共通格子番号はなぜ違うのか？ 左上を必ず(1,1)にするのか？", "question_en": "Why are photo indices and common lattice indices different?", "answer_ja": "写真番号は各行の検出候補を左から数えます。共通格子番号は傾き補正後の最上の格子行を1、最左の格子列を1として、欠けたセルを空けます。実測点が共通番号(1,1)に存在するとは限りません。", "answer_en": "Photo indices count detected candidates within each row. Common lattice indices keep the missing positions empty in an orientation-corrected coordinate frame. An actual dot need not exist at common cell (1,1).", "details": ["代表画像：写真(1,1)は共通(1,4)。最上行と最左列の起点は同じ実測点ではない。", "写真(7,4)は共通(7,6)。その下の写真(8,2)は共通(8,6)なので、列6の下端は後者となり前者を残せる。", "番号は点の位置関係を表すもの。画面外や未検出位置に測定値を補間していない。"], "sources": ["全15画像の格子座標と採否.json, record 10"]}]</script>
<script>

const DATA=JSON.parse(document.getElementById('qaData').textContent),$=id=>document.getElementById(id),synth=window.speechSynthesis;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
function stop(){if(synth)synth.cancel();$('status').textContent='';}
function speak(text){if(!synth){$('status').textContent=' このブラウザは読み上げ非対応です。';return;}stop();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;const v=synth.getVoices().find(v=>/^en[-_]/i.test(v.lang));if(v)u.voice=v;u.onerror=()=>{$('status').textContent=' 音声を再生できませんでした。';};synth.speak(u);}
const categories=[...new Set(DATA.map(q=>q.category))];categories.forEach(c=>$('category').add(new Option(c,c)));
const nodes=[];
for(const [i,q] of DATA.entries()){
 const d=el('details');d.id=q.id;const s=el('summary',`${i+1}. ${q.question}`);s.append(el('small',`${q.category} / ${q.priority==='A'?'先に準備':'詳細を聞かれたら'}`));d.append(s);
 const content=el('div',undefined,'content');content.append(el('p','英語での質問例','label'),el('p',q.question_en,'question-en'));
 const question=el('button','質問を聞く','listen');question.onclick=()=>speak(q.question_en);question.disabled=!synth;content.append(question);
 content.append(el('p','短い英語回答','label'),el('p',q.answer_en,'answer-en'));const answer=el('button','英語回答を聞く','listen');answer.onclick=()=>speak(q.answer_en);answer.disabled=!synth;content.append(answer,el('p',q.answer_ja,'answer-ja'));
 const explanation=el('div',undefined,'explanation');q.details.forEach(p=>explanation.append(el('p',p)));content.append(explanation);if(q.formula)content.append(el('pre',q.formula));
 const sources=el('div',undefined,'sources');sources.append(el('p','根拠: '+q.sources.join(' / ')));q.pages.forEach(p=>{const a=el('a',`原稿${p}ページ`);a.href='index.html?page='+p;sources.append(a);});content.append(sources);d.append(content);$('list').append(d);nodes.push({q,d});
}
function filter(){const query=$('search').value.trim().toLowerCase(),category=$('category').value,priority=$('priority').value;let count=0;for(const {q,d} of nodes){const match=(!category||q.category===category)&&(!priority||q.priority===priority)&&(!query||JSON.stringify(q).toLowerCase().includes(query));d.hidden=!match;if(match)count++;}$('count').textContent=`${count} / ${DATA.length}問`;}
$('search').oninput=filter;$('category').onchange=filter;$('priority').onchange=filter;$('stop').onclick=stop;
$('expand').onclick=()=>{const visible=nodes.filter(n=>!n.d.hidden);const open=visible.some(n=>!n.d.open);visible.forEach(n=>n.d.open=open);$('expand').textContent=open?'表示中をすべて閉じる':'表示中をすべて開く';};
const hash=location.hash.slice(1);if(hash){const item=nodes.find(n=>n.q.id===hash);if(item){item.d.open=true;item.d.scrollIntoView();}}
window.addEventListener('pagehide',stop);filter();
</script></html>
